    + (t === 'corpo' ? vCorpo() : vCargas());
}
function vCorpo(){
  const M = S.medidas; const freq = S.perfil.freqMed || 'mensal';
  const freqCard = `<section class="card"><div class="field"><label for="freq">Atualizar medidas</label><select class="input" id="freq" data-in="freq">${Object.entries(FREQ).map(([k,v])=>`<option value="${k}"${k===freq?' selected':''}>${v[0]}</option>`).join('')}</select></div>
    <p class="note">Dica: meça sempre no mesmo horário, de manhã e em jejum, com a fita rente à pele sem apertar.</p></section>`;
  if (!M.length) return `<section class="card empty-state">${mascot()}<h2>Comece pelo peso e pelas medidas de hoje</h2>
    <p class="muted">Cada registro fica guardado com a data. Depois você compara, por exemplo, 10/10 com 30/10 e vê quanto mudou.</p>
    <button class="btn primary" data-act="addMed">${IC.plus}Registrar medidas</button></section>` + freqCard;
  if (!M.some(r=>r.id===S.cmpA)) S.cmpA = M[0].id;
  if (!M.some(r=>r.id===S.cmpB)) S.cmpB = M[M.length-1].id;
  const A = M.find(r=>r.id===S.cmpA), B = M.find(r=>r.id===S.cmpB);
  const last = M[M.length-1], prev = M[M.length-2];
  const due = medDue();
  const dias = Math.round(Math.abs(B.ts - A.ts)/864e5);
  const opt = sel => M.map(r=>`<option value="${esc(r.id)}"${r.id===sel?' selected':''}>${new Date(r.ts).toLocaleDateString('pt-BR')}${num(r.peso)!==null?' · '+fmt(r.peso)+' kg':''}</option>`).join('');
  const rows = MEDIDAS.filter(([k]) => num(A[k]) !== null || num(B[k]) !== null).map(([k,l,u]) => {
    const a = num(A[k]), b = num(B[k]);
    return `<tr><td>${l}</td><td>${a!==null?fmt(a)+' '+u:'—'}</td><td>${b!==null?fmt(b)+' '+u:'—'}</td><td class="df">${a!==null&&b!==null?diffTxt(a,b,u):'—'}</td></tr>`;
  }).join('');
  const pa = num(A.peso), pb = num(B.peso);
  const headline = pa !== null && pb !== null && A !== B
    ? `Em <b>${ddmm(A.ts)}</b> você estava com <b>${fmt(pa)} kg</b>; em <b>${ddmm(B.ts)}</b>, com <b>${fmt(pb)} kg</b>: ${diffTxt(pa,pb,'kg')} em ${dias} dia${dias!==1?'s':''}.`
    : A === B ? 'Escolha duas datas diferentes para comparar.' : `Comparando ${ddmm(A.ts)} com ${ddmm(B.ts)} (${dias} dias).`;
  const disp = MEDIDAS.filter(([k]) => M.some(r => num(r[k]) !== null));
  if (!disp.some(([k])=>k===S.medKey) && disp.length) S.medKey = disp[0][0];
  const md = MEDIDAS.find(([k])=>k===S.medKey) || MEDIDAS[0];
  const pts = M.filter(r => num(r[md[0]]) !== null).map(r => ({label:ddmm(r.ts), y:+r[md[0]]}));
  return `<section class="card"><div class="between"><div><p class="eyebrow">Última medição</p><h2>${new Date(last.ts).toLocaleDateString('pt-BR', {day:'numeric', month:'long', year:'numeric'})}</h2></div>
      <span class="chip ${due<=0?'warn':''}">${due<=0?'Hora de atualizar':`Próxima em ${due}d`}</span></div>
    <div class="kpis">${MEDIDAS.filter(([k]) => num(last[k]) !== null).map(([k,l,u]) => {
      const p = prev && num(prev[k]) !== null ? `<span class="dl">${diffTxt(+prev[k], +last[k], u)} vs ${ddmm(prev.ts)}</span>` : '';
      return `<div class="kpi"><span>${l}</span><b>${fmt(last[k])} ${u}</b>${p}</div>`; }).join('')}</div>
    <button class="btn primary" data-act="addMed">${IC.plus}Nova medição</button></section>
  <section class="card"><h2>Comparar datas</h2>
    <div class="grid2"><div class="field"><label for="cmp-a">De</label><select class="input" id="cmp-a" data-in="cmpA">${opt(S.cmpA)}</select></div>
      <div class="field"><label for="cmp-b">Até</label><select class="input" id="cmp-b" data-in="cmpB">${opt(S.cmpB)}</select></div></div>
    <p class="headline">${headline}</p>
    <div class="tablewrap"><table class="cmp"><thead><tr><th>Medida</th><th>${ddmm(A.ts)}</th><th>${ddmm(B.ts)}</th><th>Diferença</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  ${disp.length ? `<section class="card"><div class="field"><label for="med-k">Gráfico</label><select class="input" id="med-k" data-in="medKey">${disp.map(([k,l])=>`<option value="${k}"${k===md[0]?' selected':''}>${l}</option>`).join('')}</select></div>

  <section class="card"><h2>Histórico</h2><div>${[...M].reverse().map(r => `<div class="medrow"><div><strong>${new Date(r.ts).toLocaleDateString('pt-BR')}</strong>
      <small>${MEDIDAS.filter(([k])=>num(r[k])!==null).map(([k,l,u])=>`${l.split(' ')[0]} ${fmt(r[k])}${u==='%'?'%':''}`).join(' · ')}</small>${r.obs?`<small>${esc(r.obs)}</small>`:''}</div>
      <button class="icon-btn" data-act="editMed" data-id="${esc(r.id)}" aria-label="Editar medição">${IC.edit}</button></div>`).join('')}</div></section>
  ${freqCard}`;
}
function vCargas(){
  const keys = {};
  for (const s of S.sessoes) for (const it of (s.itens||[])){ const k = keys[it.key] || (keys[it.key] = {key:it.key, nome:it.nome, n:0, last:0}); k.n++; k.last = Math.max(k.last, s.ts); k.nome = it.nome; }
  const list = Object.values(keys).sort((a,b)=>b.last-a.last);
  const wc = weekCounts(12); const meta = +S.perfil.meta || 4;
  if (!list.length) return `<section class="card empty-state">${mascot()}<h2>Sua evolução começa no primeiro treino</h2>
    <p class="muted">Registre as cargas de cada série. Aqui aparecem os gráficos semana a semana de cada exercício, seus recordes e a frequência.</p>
    <button class="btn primary" data-act="nav" data-v="treino">${IC.play}Começar treino</button></section>`;
  if (!S.evoKey || !keys[S.evoKey]) S.evoKey = list[0].key;
  const key = S.evoKey, h = histFor(key), m = S.evoMetric;
  const byWeek = new Map();
  for (const x of h){
    const w = weekStart(x.ts); const cur = byWeek.get(w) || {carga:0, e1rm:0, volume:0};
    cur.carga = Math.max(cur.carga, bestKg(x.sets));
    cur.e1rm = Math.max(cur.e1rm, ...x.sets.map(s=>e1rm(s.kg, s.reps)));
    cur.volume += x.sets.reduce((a,s)=>a+(+s.kg||0)*(+s.reps||0),0);
    byWeek.set(w, cur);
  }
  const weeks = [...byWeek.entries()].sort((a,b)=>a[0]-b[0]);
  const pts = weeks.map(([w,v]) => ({label:ddmm(w), y:Math.round(v[m]*10)/10}));
  const unit = 'kg';
  const first = pts[0].y, lastv = pts[pts.length-1].y; const diff = first ? (lastv-first)/first*100 : 0;
  const prKg = Math.max(...h.map(x=>bestKg(x.sets))); const prSess = h.find(x=>bestKg(x.sets)===prKg);
  let bestSet = {kg:0, reps:0, v:0}; h.forEach(x => x.sets.forEach(s => { const v = e1rm(s.kg,s.reps); if (v > bestSet.v) bestSet = {kg:s.kg, reps:s.reps, v}; }));
  const mLabel = {carga:'Carga máxima', e1rm:'1RM estimado', volume:'Volume (kg × reps)'}[m];
  return `<section class="card"><div class="field"><label for="evo-sel">Exercício</label><select class="input" id="evo-sel" data-in="evokey">${list.map(k=>`<option value="${esc(k.key)}"${k.key===key?' selected':''}>${esc(k.nome)} (${k.n})</option>`).join('')}</select></div>
    <div class="tabs">${[['carga','Carga máx.'],['e1rm','1RM est.'],['volume','Volume']].map(([k,l])=>`<button class="${m===k?'on':''}" data-act="evoM" data-m="${k}">${l}</button>`).join('')}</div>
    <p class="eyebrow">${mLabel} por semana</p>
    ${lineChart(pts, unit)}
    ${pts.length < 2 ? `<p class="note">Treine este exercício em outra semana para ver a linha de evolução.</p>` : ''}
    <div class="kpis">
      <div class="kpi"><span>Recorde de carga</span><b>${fmt(prKg)} kg</b><span>${prSess?rel(prSess.ts):''}</span></div>
      <div class="kpi"><span>${esc(mLabel)}: início → agora</span><b class="${diff>0?'up':diff<0?'down':''}">${diff>0?'+':''}${fmt(diff,0)}%</b><span>${fmt(first)} → ${fmt(lastv)} kg</span></div>
      <div class="kpi"><span>Melhor série</span><b>${fmt(bestSet.kg)}×${esc(bestSet.reps)}</b><span>1RM est. ${fmt(bestSet.v)} kg</span></div>
      <div class="kpi"><span>Sessões registradas</span><b>${h.length}</b><span>em ${weeks.length} semana${weeks.length>1?'s':''}</span></div>
    </div>
    <button class="btn sm ghost" data-act="info" data-name="${esc(h[h.length-1].nome)}">${IC.info}Ver execução do exercício</button></section>
  <section class="card"><h2>Histórico</h2><div class="hist">${[...h].reverse().slice(0,30).map(x=>`<div class="hrow"><span class="d">${ddmm(x.ts)}<br>${new Date(x.ts).getFullYear()}</span>
    <span class="s">${x.sets.map(s=>`<span>${(+s.kg||0)===bestKg(x.sets)?`<b>${fmt(s.kg)}</b>`:fmt(s.kg)} kg × ${esc(s.reps)}</span>`).join('')}</span></div>`).join('')}</div></section>
  <section class="card"><div class="between"><h2>Frequência</h2><span class="chip ${streakWeeks()?'ok':''}">${streakWeeks()} sem. na meta</span></div><p class="note">Treinos por semana nas últimas 12 semanas.</p>${barChart(wc, meta)}</section>`;
}

const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
function dayDoc(k){ return S.diario[k] || {id:k, data:k, refeicoes:{}, agua:0}; }
function dayTotals(k){ const d = dayDoc(k); return sumItems(Object.values(d.refeicoes||{}).flat()); }
/* ---- placar diário de metas ---- */
const METAS_DEF = [['kcal','Calorias','kcal','kcal'],['p','Proteína','g','p'],['c','Carboidrato','g','c'],['g','Gordura','g','gd'],['a','Água','L','agua']];
const metasAtuais = () => ({kcal:+S.dieta.metaKcal||0, p:+S.dieta.metaP||0, c:+S.dieta.metaC||0, g:+S.dieta.metaG||0, a:aguaMeta()});
function metasOf(doc){ return (doc.id === dayKey(Date.now()) || !doc.metas) ? metasAtuais() : doc.metas; }
function avaliaDia(k){
  const doc = S.diario[k]; if (!doc) return null;
  const items = Object.values(doc.refeicoes||{}).flat().filter(i => !i.desconhecido); if (!items.length && !aguaDia(doc)) return null;
  const t = sumItems(items), m = metasOf(doc); t.agua = aguaDia(doc) / 1000;
  const res = METAS_DEF.filter(([key]) => +m[key] > 0 && (items.length || key === 'a')).map(([key, l, u, tk]) => {
    const v = t[tk], meta = +m[key], pct = v/meta;
    const ok = (key === 'p' || key === 'a') ? pct >= 0.9 : (pct >= 0.9 && pct <= 1.1);
    return {key, l, u, v, meta, pct, ok, lado: ok ? '' : pct < 1 ? 'abaixo' : 'acima'};
  });
  if (!res.length) return null;
  return {k, res, hits:res.filter(r=>r.ok).length, total:res.length, t};
}

function radar(a){
  const ax = [['FOR',a.forca],['VIT',a.resistencia],['AGI',a.agilidade],['DIS',a.disciplina]], cx = 120, cy = 120, R = 84;
  const pt = (i, v) => { const ang = -Math.PI/2 + i*Math.PI/2; return [(cx + Math.cos(ang)*R*v/100).toFixed(1), (cy + Math.sin(ang)*R*v/100).toFixed(1)]; };
  let g = ''; for (const f of [25,50,75,100]) g += `<polygon class="rg" points="${ax.map((_,i) => pt(i,f).join(',')).join(' ')}"/>`;
  g += ax.map((_,i) => { const [x,y] = pt(i,100); return `<line class="rg" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`; }).join('');
  const poly = ax.map(([,v],i) => pt(i, Math.max(v,3)).join(',')).join(' ');
  const lab = ax.map(([k,v],i) => { const [x,y] = pt(i,124); return `<text x="${x}" y="${+y+4}" text-anchor="middle">${k} ${v}</text>`; }).join('');
  return `<svg class="radar" viewBox="-24 0 288 240" role="img" aria-label="Atributos: ${ax.map(([k,v]) => k+' '+v).join(', ')}">${g}<polygon class="rv" points="${poly}"/>${lab}</svg>`;
}

const SFX = {
  on(){ return S.sys.som !== false; },
  tone(seq){
    if (!this.on()) return; ensureAudio(); if (!AC) return;
    const t0 = AC.currentTime + 0.01;
    for (const [t, f, d, type = 'sine', v = .16, f2] of seq){ try {
      const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0+t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0+t+d);
      g.gain.setValueAtTime(.0001, t0+t); g.gain.exponentialRampToValueAtTime(v, t0+t+.012); g.gain.exponentialRampToValueAtTime(.0001, t0+t+d);
      o.connect(g); g.connect(AC.destination); o.start(t0+t); o.stop(t0+t+d+.03); } catch(e){} }
  },
  serie(){ this.tone([[0,1320,.05,'square',.05],[.045,1980,.11,'sine',.13]]); },
  alarme(){ this.tone([[0,880,.13,'sawtooth',.1],[.17,880,.13,'sawtooth',.1],[.34,1320,.13,'sawtooth',.1],[.52,1760,.35,'square',.08]]); },
  levelUp(){ this.tone([[0,523,.12,'triangle',.2],[.1,659,.12,'triangle',.2],[.2,784,.12,'triangle',.2],[.32,1047,.6,'sawtooth',.12,2093],[.32,523,.6,'sine',.16],[.32,784,.6,'sine',.1]]); },
  pr(){ this.tone([[0,392,.09,'square',.1],[.09,587,.09,'square',.1],[.18,784,.4,'sawtooth',.13,1568],[.18,392,.4,'sine',.12]]); },
  sistema(){ this.tone([[0,180,.3,'sawtooth',.09,520],[.08,1046,.12,'sine',.08],[.2,1568,.18,'sine',.06]]); },
  alerta(){ this.tone([[0,330,.2,'square',.09],[.24,247,.35,'square',.09]]); }
};

/* =========================================================
   GRÁFICO DE EVOLUÇÃO DA 1RM (tela do exercício)

function rmChartHTML(key){
  const byW = new Map();
  for (const x of histFor(key)){ if (x.deload) continue;
    const v = Math.max(0, ...x.sets.filter(s => (parseInt(s.reps)||0) <= 12).map(s => rm1(s.kg, s.reps))); if (!v) continue;
    const w = weekStart(x.ts); byW.set(w, Math.max(byW.get(w)||0, v)); }
  let pts = [...byW.entries()].sort((a,b) => a[0]-b[0]).map(([w,v]) => ({y:Math.round(v*10)/10, label:ddmm(w), ts:w}));
  if (!pts.length) return '';
  const mensal = pts.length > 26;
  if (mensal){ const m = new Map(); for (const p of pts){ const d = new Date(p.ts), k = d.getFullYear()*12 + d.getMonth();
      m.set(k, {y:Math.max((m.get(k)||{y:0}).y, p.y), label:String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getFullYear()).slice(2)}); } pts = [...m.values()]; }
  const ini = pts[0].y, fim = pts[pts.length-1].y, best = Math.max(...pts.map(p => p.y));
  return `<div class="sysw chartw"><p class="sys-h">[ EVOLUÇÃO DA 1RM ESTIMADA ]</p>${lineChart(pts, 'kg')}
    <p class="sys-m tipv" aria-live="polite">Toque num ponto para ver o valor.</p>
    <div class="kpis"><div class="kpi"><span>Início</span><b>${fmt(ini)} kg</b></div><div class="kpi"><span>Atual</span><b>${fmt(fim)} kg</b></div><div class="kpi"><span>Recorde</span><b>${fmt(best)} kg</b></div></div>
    <p class="sys-m">${pts.length > 1 ? `${fim >= ini ? '+' : ''}${fmt(fim-ini)} kg (${fim >= ini ? '+' : ''}${fmt((fim/ini-1)*100,1)}%) desde o primeiro registro` : 'Registre mais semanas para ver a curva.'} · melhor 1RM ${mensal ? 'de cada mês' : 'de cada semana'}</p></div>`;
}

const FotoDB = {
  db:null,
  open(){ return this.db || (this.db = new Promise((res, rej) => { const r = indexedDB.open('dynamica-fotos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('fotos', {keyPath:'id'}); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('fotos', mode), req = fn(t.objectStore('fotos'));
    t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  all(){ return this.tx('readonly', st => st.getAll()); },
  put(f){ return this.tx('readwrite', st => st.put(f)); },
  del(id){ return this.tx('readwrite', st => st.delete(id)); }
};

async function compressImg(file, max = 1000, q = .8){
  const url = URL.createObjectURL(file), img = new Image(); img.src = url; await img.decode();
  const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url); return c.toDataURL('image/jpeg', q);
}

/* ---- Avaliação do Sistema ---- */
function treinoResumo(){
  const now = Date.now(), grupo = (a, b) => { const g = {}; REC_GRUPOS.forEach(([n]) => g[n] = 0);
    for (const s of S.sessoes) if (s.ts >= a && s.ts < b) for (const it of (s.itens||[])){ const inf = getInfo(it.nome); if (!inf) continue;
      for (const [n, ms] of REC_GRUPOS){ const w = inf.primarios.some(m => ms.includes(m)) ? 1 : inf.secundarios.some(m => ms.includes(m)) ? .5 : 0; g[n] += w * (it.sets||[]).length; } }
    Object.keys(g).forEach(k => g[k] = Math.round(g[k] / 4 * 10) / 10); return g; };
  return {atual:grupo(now - 28*DIA_MS, now + 1), antes:grupo(now - 56*DIA_MS, now - 28*DIA_MS)};
}
function avalMetricas(f, ant){
  const r = treinoResumo(), c = sysCalc();
  const g = REC_GRUPOS.map(([n]) => ({n, v:r.atual[n], d:r.atual[n] - r.antes[n]}));
  const fortes = [...g].filter(x => x.v > 0).sort((a,b) => (b.v + b.d*2) - (a.v + a.d*2)).slice(0, 3)
    .map(x => ({musculo:x.n, motivo:`${fmt(x.v)} séries por semana${x.d > 0 ? ` (+${fmt(x.d)} sobre o mês anterior)` : ''}. Está entre os grupos mais estimulados.`}));
  const fracos = [...g].sort((a,b) => a.v - b.v).slice(0, 3)
    .map(x => ({musculo:x.n, motivo:x.v < 10 ? `Só ${fmt(x.v)} séries por semana. O alvo para crescer é de 10 a 20.` : `${fmt(x.v)} séries por semana, abaixo dos outros grupos.`}));
  const dPeso = ant && ant.peso && f.peso ? Math.round((f.peso - ant.peso)*10)/10 : null, dias = ant ? Math.round((f.ts - ant.ts) / DIA_MS) : null;
  const nota = Math.round(Math.min(100, c.attr.disciplina*0.45 + c.attr.forca*0.35 + Math.min(20, g.filter(x => x.d > 0).length*4)));
  const veredito = nota >= 75 ? 'Progresso consistente. O Sistema reconhece seu esforço.' : nota >= 50 ? 'Evolução em curso, mas há margem. Aumente a constância.' : 'Progresso insuficiente. O Sistema exige mais disciplina.';
  const fala = `Atenção, Caçador. Análise concluída. ${fortes.length ? 'Maior estímulo detectado em ' + fortes.map(x => x.musculo).join(', ') + '.' : 'Nenhum estímulo relevante detectado.'} Alvos de ataque: ${fracos.map(x => x.musculo).join(', ')}. ${dPeso !== null ? `Variação de peso: ${fmt(dPeso)} quilos em ${dias} dias. ` : ''}${veredito} Continue treinando.`;
  return {fonte:'metricas', ts:Date.now(), fortes, fracos, nota, veredito, fala};
}
async function avalIA(f, ant){
  const r = treinoResumo(), imgs = [await dataFile(f.data, 'atual.jpg')]; if (ant) imgs.push(await dataFile(ant.data, 'anterior.jpg'));
  const prompt = `Você é o "Sistema", avaliador de físico de um app de musculação com estilo de painel de RPG. Seja honesto, técnico e respeitoso.
A primeira imagem é a foto ATUAL (${poseNome(f.pose)}, ${new Date(f.ts).toLocaleDateString('pt-BR')}${f.peso ? ', ' + f.peso + ' kg' : ''}).${ant ? ` A segunda é a foto ANTERIOR da mesma pose (${new Date(ant.ts).toLocaleDateString('pt-BR')}${ant.peso ? ', ' + ant.peso + ' kg' : ''}). Compare as duas.` : ' Não há foto anterior: avalie só o estado atual.'}
Séries por semana de cada grupo muscular (últimas 4 semanas / 4 anteriores): ${JSON.stringify(r)}.
Avalie apenas grupos musculares visíveis na pose. Não faça comentários médicos nem sobre qualquer coisa além do físico, e não invente números de % de gordura.
Responda SOMENTE com JSON:
{"fortes":[{"musculo":"","motivo":""}],"fracos":[{"musculo":"","motivo":""}],"nota":0,"veredito":"frase curta e motivacional","fala":"até 45 palavras em português, começando com 'Atenção, Caçador.', tom de sistema robótico, épico e autoritário, resumindo a evolução e os alvos"}
Use 2 ou 3 itens em fortes e em fracos, com nomes como Peito, Costas, Ombros, Bíceps, Tríceps, Abdômen, Quadríceps, Posterior, Glúteos, Panturrilhas. nota vai de 0 a 100.`;
  const j = await Store.ai.json(prompt, {images:imgs});
  const arr = x => (Array.isArray(x) ? x : []).slice(0, 4).map(o => ({musculo:String((o && o.musculo) || '').slice(0, 30), motivo:String((o && o.motivo) || '').slice(0, 220)})).filter(o => o.musculo);
  const out = {fonte:'ia', ts:Date.now(), fortes:arr(j && j.fortes), fracos:arr(j && j.fracos), nota:Math.max(0, Math.min(100, parseInt(j && j.nota) || 0)),
    veredito:String((j && j.veredito) || '').slice(0, 180), fala:String((j && j.fala) || '').slice(0, 420)};
  if (!out.fortes.length && !out.fracos.length) throw {code:'invalid_json'};
  if (!out.fala) out.fala = `Atenção, Caçador. ${out.veredito}`;
  return out;
}

async function avaliar(btn){

let VOZ_PRONTA = false;
function primeVoz(){
  ensureAudio();
  try { const a = fishAudioEl(); if (!a.dataset.ok){ a.src = WAV_MUDO; a.play().then(() => { a.dataset.ok = '1'; }).catch(() => {}); } } catch(e){}
  try { if (!('speechSynthesis' in window)) return; speechSynthesis.resume();
    if (!VOZ_PRONTA){ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'pt-BR'; speechSynthesis.speak(u); VOZ_PRONTA = true; } } catch(e){}
}
function vozesPT(){
  return new Promise(res => {
    const pega = () => speechSynthesis.getVoices().filter(v => /^pt/i.test(v.lang));
    const vs = pega(); if (vs.length || !('onvoiceschanged' in speechSynthesis)) return res(vs);
    const t = setTimeout(() => res(pega()), 1200);
    speechSynthesis.addEventListener('voiceschanged', () => { clearTimeout(t); res(pega()); }, {once:true});
  });
}
async function falarLocal(txt){
  if (!('speechSynthesis' in window)) throw {code:'sem_voz'};
  const vs = await vozesPT();
  const pref = vs.find(v => /daniel|ricardo|felipe|antonio|male|masculin/i.test(v.name)) || vs.find(v => /BR/i.test(v.lang)) || vs[0];
  const frases = (String(txt).match(/[^.!?;:\n]+[.!?;:]?/g) || [txt]).map(s => s.trim()).filter(Boolean)
    .flatMap(s => s.length > 180 ? s.match(/.{1,180}(\s|$)/g) : [s]);
  speechSynthesis.cancel(); await new Promise(r => setTimeout(r, 80));
  return new Promise((res, rej) => {
    let i = 0, falou = false, acabou = false;
    falarLocal.refs = [];   // o Chrome descarta frases sem referência e o "onend" some: guardamos todas
    const keep = setInterval(() => { try { if (speechSynthesis.speaking) speechSynthesis.resume(); } catch(e){} }, 5000);
    const fim = ok => { if (acabou) return; acabou = true; clearInterval(keep); clearTimeout(guarda); clearTimeout(teto); falarLocal.refs = []; ok ? res() : rej({code:'bloqueado'}); };
    const guarda = setTimeout(() => { if (!falou) { speechSynthesis.cancel(); fim(false); } }, 4000);          // nada começou: o aparelho bloqueou
    const teto = setTimeout(() => fim(true), 6000 + String(txt).length * 110);                                // nunca fica "falando" para sempre
    const prox = () => {
      if (acabou) return;
      if (i >= frases.length) return fim(true);
      const u = new SpeechSynthesisUtterance(frases[i++]); u.lang = 'pt-BR'; u.pitch = 0.55; u.rate = 0.95; u.volume = 1; if (pref) u.voice = pref;
      falarLocal.refs.push(u);
      u.onstart = () => { falou = true; };
      u.onend = prox;
      u.onerror = e => { if (e.error === 'interrupted' || e.error === 'canceled') return fim(true); if (!falou) return fim(false); prox(); };
      speechSynthesis.speak(u);
    };
    prox();
  });
}

};
async function mentorFalar(txt){
  const limpo = String(txt).replace(/[*_#>`|~]/g, '').replace(/\[\s*sistema\s*\]/gi, 'Sistema.').replace(/\s+/g, ' ').trim().slice(0, 1900);
  if (!limpo) return;
  if (MENTOR.tts === undefined) MENTOR.tts = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('tts').catch(() => null) : null;
  MENTOR.falando = true; mentorAnim();
  if (FISH.ativo()){
    const nome = FISH.cfg().vozNome || 'Fish Audio';
    vozStatus(`🔊 Falando com a voz ${nome}…`);
    try { await fishFalar(limpo); vozStatus(`Voz: ${nome} (Fish Audio)`); MENTOR.falando = false; mentorAnim(); return; }
    catch(e){
      const c = (e && e.code) || 'fish_erro';
      if (c === 'no_gesture'){ vozStatus('O celular pediu um toque antes de tocar o áudio. Toque em 🔊 para ouvir.', true); MENTOR.falando = false; mentorAnim(); return; }
      toast((VOZ_ERROS[c] || VOZ_ERROS.fish_erro) + (e.message ? ' (' + e.message.slice(0, 80) + ')' : '') + ' Usando outra voz.');
    }
  }
  let motor = MENTOR.tts && !MENTOR.ttsOff ? 'claude' : 'local';
  try {
    if (motor === 'claude'){
      vozStatus('🔊 Falando com a voz do Claude…');
      try { await MENTOR.tts.speak(limpo, {voice:S.sys.mentorVozId || 'rounded', language:'pt-BR', rate:0.95}); }
      catch(e){
        const c = (e && e.code) || 'upstream_error';
        if (c === 'stopped') throw e;                                   // parado de propósito
        if (c === 'not_granted'){ MENTOR.ttsOff = true; throw e; }      // o usuário desligou: não usar outra voz
        if (c === 'no_gesture' || c === 'busy') throw e;               // precisa de um toque
        motor = 'local'; vozStatus('🔊 Falando com a voz do celular…'); await falarLocal(limpo);
        vozStatus(VOZ_ERROS[c] || VOZ_ERROS.upstream_error, false); MENTOR.falando = false; mentorAnim(); return;
      }
    } else { vozStatus('🔊 Falando com a voz do celular…'); await falarLocal(limpo); }
    vozStatus(motor === 'claude' ? 'Voz: Claude' : 'Voz: celular');
  } catch(e){
    const c = (e && e.code) || 'bloqueado';
    if (c === 'stopped') vozStatus('Voz parada.');
    else vozStatus(VOZ_ERROS[c] || ('Não consegui tocar o áudio (' + c + ').'), true);
  }
  MENTOR.falando = false; mentorAnim();
}

function mentorParar(){
  try { MENTOR.ctrl && MENTOR.ctrl.abort(); } catch(e){}
  try { FISH.audio && !FISH.audio.paused && FISH.audio.pause(); } catch(e){}

  MENTOR.falando = false; mentorAnim();
}

${txt?'Texto da ficha:\n'+txt:''}`;

async function applyImport(){
  if (!IMPORT) return;
  const rep = $('#imp-rep') && $('#imp-rep').checked;
  if (rep) for (const f of [...S.fichas]) await Store.remove('fichas', f.id);
  const usadas = rep ? [] : S.fichas.map(x=>x.letra); let ordem = rep ? 0 : S.fichas.length;
  for (const f of IMPORT){
    const m = f.nome.match(/\b([A-J])\b/); let letra = m && !usadas.includes(m[1]) ? m[1] : 'ABCDEFGHIJ'.split('').find(l=>!usadas.includes(l)) || String(ordem+1);
    usadas.push(letra);
    const id = 'f' + uid();
    await Store.put('fichas', id, {id, letra, nome:f.nome, foco:f.foco, cor:CORES[ordem % CORES.length], ordem, exercicios:f.exercicios});
    ordem++;
  }
  draftClear('importar'); closeSheet(); toast('Fichas adicionadas!'); S.fichasTab = 'lista'; go('fichas');
}

async function saveWorkout(){
  const itens = ATIVO.itens.map(it => { const sets = it.sets.filter(s => s.done || (String(s.kg)!=='' && String(s.reps)!=='')).map(s => {
      const kg = kgNum(s.kg), reps = parseInt(s.reps)||0, o = {kg, reps, rm:Math.round(rm1(kg, reps)*10)/10};
      if (s.rir !== undefined && s.rir !== '') o.rir = String(s.rir); return o; });
    return {key:it.key, nome:it.nome, sets, rm1:Math.max(0, ...sets.filter(x => x.reps <= 12).map(x => x.rm))}; }).filter(it=>it.sets.length);
  if (!itens.length){ toast('Marque pelo menos uma série antes de salvar.'); return; }
  const prs = itens.map(it => { const prev = maxKgBefore(it.key); const mk = bestKg(it.sets); return prev > 0 && mk > prev ? {nome:it.nome, kg:mk, prev} : null; }).filter(Boolean);
  const sess = {id:ATIVO.id, ts:ATIVO.inicio, data:new Date(ATIVO.inicio).toISOString(), fichaId:ATIVO.fichaId, fichaNome:ATIVO.fichaNome, duracao:Math.round((Date.now()-ATIVO.inicio)/1000), itens};
  if (ATIVO.deload) sess.deload = true;
  const eqHoje = (S.sys.inv||[]).filter(x => invHoje().includes(x.id)).map(x => x.nome); if (eqHoje.length) sess.equip = eqHoje;
  const c0 = sysCalc();
  ATIVO = null; LS.del('bb_ativo'); stopRest();
  Store.apply('sessoes', sess.id, clone(sess)); S.sys.rm = rmTable();   // salva o treino e a tabela de 1RM juntos
  await Store.put('sessoes', sess.id, sess);
  const vol = sessVolume(sess);
  const c1 = sysCalc(), ganho = Math.max(0, Math.round(c1.totalXp - c0.totalXp)), le = c1.ledger.find(e => e.sid === sess.id);
  const sysBox = `<div class="sysw" style="text-align:left"><p class="sys-h">[ SISTEMA ] XP RECEBIDO</p><b class="sys-lv">+${ganho} XP</b>
    <p class="sys-m">${le && le.det.length ? esc(le.det.join(' · ')) : 'XP de manutenção. Para ganhar mais, supere suas cargas ou repetições.'}</p>${sysBar(c1)}<p class="sys-m">Nível ${c1.level} · Rank ${c1.rank} · Ofensiva ${c1.streak}</p></div>`;
  openSheet(`<div class="summary">${mascot('party')}<p class="eyebrow">Treino salvo</p><h1>Mandou bem!</h1>
    <div class="kpis" style="width:100%"><div class="kpi"><span>Duração</span><b>${hhmmss(sess.duracao)}</b></div><div class="kpi"><span>Volume</span><b>${fmt(vol/1000,2)} t</b></div>
    <div class="kpi"><span>Séries</span><b>${sessSets(sess)}</b></div><div class="kpi"><span>Recordes</span><b class="${prs.length?'up':''}">${prs.length}</b></div></div>
    ${prs.length?`<div class="pr-list" style="width:100%;text-align:left">${prs.map(p=>`<div class="pr"><span class="tro">${IC.trophy}</span><div><strong>${esc(p.nome)}</strong><small>antes ${fmt(p.prev)} kg</small></div><b class="mono">${fmt(p.kg)} kg</b></div>`).join('')}</div>`:'<p class="muted">Cada treino registrado deixa sua evolução mais clara.</p>'}
    ${sysBox}
    <button class="btn primary block" data-act="closeSheet">Fechar</button></div>`);
  go('home');
}

let REST = null, AC = null;
function ensureAudio(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); }catch(e){} }
function beep(){ if (!AC) return; try{ [0,.2,.4].forEach((t,i) => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = i===2 ? 1175 : 880; const s = AC.currentTime + t;
  g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(.25, s+.02); g.gain.exponentialRampToValueAtTime(.0001, s+.16); o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s+.17); }); }catch(e){} }
/* Cronômetro de descanso: abre em tela cheia quando ela confirma uma série.
   REST = {end, total, nome, prox, aviso, fired, mini} — tudo salvo para sobreviver a recarregar a página. */
function startRest(sec, info){ REST = {end:Date.now()+sec*1000, total:sec, fired:false, mini:false, shell:'', ...info}; LS.set('bb_rest', REST); tickRest(); }
function stopRest(){ REST = null; LS.del('bb_rest'); const el = $('#rest'); el.hidden = true; el.innerHTML = ''; el.dataset.shell = ''; }
function restShell(mode){
  const el = $('#rest'); if (el.dataset.shell === mode) return; el.dataset.shell = mode;
  if (mode.startsWith('mini')){
    el.innerHTML = `<svg class="rr" viewBox="0 0 40 40"><circle class="t" cx="20" cy="20" r="16"/><circle class="b" id="rs-ring" cx="20" cy="20" r="16"/></svg>
      <div style="min-width:0" data-act="restMax"><div class="rt" id="rs-time"></div><div class="rl" id="rs-lbl"></div></div>
      <button class="btn sm" data-act="restAdd">+15s</button><button class="icon-btn" data-act="restSkip" aria-label="Pular descanso">${IC.x}</button>`;
  } else {
    el.innerHTML = `<div class="rest-card" role="dialog" aria-label="Descanso">
      <p class="eyebrow" id="rs-eye"></p><h2>${esc(REST.nome)}</h2>
      <div class="rest-ring"><svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="52"/><circle class="b" id="rs-ring" cx="60" cy="60" r="52"/></svg>
        <div class="in"><span class="big" id="rs-time"></span><span class="sm" id="rs-sub"></span></div></div>
      <div class="rest-next"><span id="rs-nl"></span><b>${esc(REST.prox)}</b>${REST.aviso?`<small class="muted">${esc(REST.aviso)}</small>`:''}</div>
      <div class="rest-adj" id="rs-adj"><button class="btn" data-act="restSub">−15s</button><button class="btn" data-act="restAdd">+15s</button></div>
      <button class="btn primary block" id="rs-main" data-act="restSkip"></button>
      <button class="btn ghost sm" id="rs-min" data-act="restMin">Minimizar e ver o treino</button></div>`;
  }
}
function tickRest(){
  const el = $('#rest'); if (!REST || $('#app').hidden){ el.hidden = true; return; }
  const left = (REST.end - Date.now())/1000; const end = left <= 0;
  if (end && left < -90){ stopRest(); return; }
  if (end && !REST.fired){
    REST.fired = true; REST.mini = false; LS.set('bb_rest', REST); SFX.alarme();
    try{ navigator.vibrate && navigator.vibrate([250,120,250,120,400]); }catch(e){}
  }
  const mode = (REST.mini ? 'mini' : 'full') + (end ? '-end' : '');
  restShell(mode);
  el.hidden = false; el.className = (REST.mini ? 'mini' : 'full') + (end ? ' end' : '');
  const frac = end ? 1 : Math.max(0, left/REST.total);
  const r = REST.mini ? 16 : 52, C = 2*Math.PI*r;
  const ring = $('#rs-ring'); if (ring) ring.setAttribute('stroke-dasharray', `${(frac*C).toFixed(1)} ${C.toFixed(1)}`);
  const tm = $('#rs-time'); if (tm) tm.textContent = end ? 'Bora!' : mmss(left);
  if (REST.mini){ const l = $('#rs-lbl'); if (l) l.textContent = end ? 'Descanso concluído: ' + REST.prox : 'Descanso · ' + REST.nome; return; }
  $('#rs-eye').textContent = end ? '[ SISTEMA ] DESCANSO CONCLUÍDO' : '[ SISTEMA ] RECUPERANDO';
  $('#rs-sub').textContent = end ? 'HORA DA PRÓXIMA' : 'de ' + mmss(REST.total);
  $('#rs-nl').textContent = end ? 'Agora' : 'A seguir';
  $('#rs-main').textContent = end ? 'Vamos!' : 'Pular descanso';
  $('#rs-adj').hidden = end; $('#rs-min').hidden = end;
}
setInterval(() => { if (REST) tickRest(); const el = $('#elapsed'); if (el && ATIVO) el.textContent = hhmmss((Date.now()-ATIVO.inicio)/1000); }, 500);

    S.sys = {...defaultSys(), ...(d.sys||{})};
    PENDING_IMPORT = null; Store.persistLocal(); closeSheet(); toast('Backup restaurado!'); go('home');
  },
  addMed: () => openMedida(null),
  editMed: t => openMedida(t.dataset.id),
  saveMed: async t => {
    const id = t.dataset.id || 'm' + uid();
    const dv = $('#md-data').value; const [y,mo,d] = dv.split('-').map(Number);
    if (!y){ toast('Escolha a data da medição.'); return; }
    const rec = {id, ts:new Date(y, mo-1, d, 12).getTime(), obs:$('#md-obs').value.trim().slice(0,160)};
    let any = false;
    for (const [k] of MEDIDAS){ const raw = $('#md-'+k).value.trim().replace(',', '.'); const v = raw === '' ? null : parseFloat(raw); rec[k] = v === null || isNaN(v) ? null : Math.round(v*10)/10; if (rec[k] !== null) any = true; }
    if (!any){ toast('Preencha pelo menos o peso ou uma medida.'); return; }
    draftClear('med:' + (t.dataset.id || 'nova'));
    await Store.put('medidas', id, rec); closeSheet(); toast('Medição salva!');
    if (!t.dataset.id){ S.cmpB = id; }
  },
  askDelMed: () => { $('#md-del').innerHTML = `<div class="confirm"><b>Apagar esta medição?</b><div class="grid2"><button class="btn" data-act="closeSheet">Cancelar</button><button class="btn danger" data-act="delMed">Apagar</button></div></div>`; },
  delMed: async () => { const id = $('[data-act="saveMed"]').dataset.id; closeSheet(); await Store.remove('medidas', id); toast('Medição apagada.'); },
  goCorpo: () => { S.evoTab = 'corpo'; LS.set('bb_evotab', 'corpo'); go('evolucao'); },
  evoTab: t => { S.evoTab = t.dataset.t; LS.set('bb_evotab', S.evoTab); render(); },
  lock: () => { LS.del('bb_unlocked'); closeSheet(); showLock(); }
};

let pfTimer = null;

    // plano alimentar: salva sozinho enquanto ela digita
    const D = S.dieta;
    if (t.dataset.dm) D[t.dataset.dm] = t.value.replace(/[^\d.,]/g,'').replace(',','.');
    else { const i = +t.dataset.i; D.refeicoes[i][t.dataset.rm] = t.value;

    clearTimeout(pfTimer); pfTimer = setTimeout(() => { Store.apply('dieta', 'plano', clone(D)); Store.persistLocal(); }, 300);
    return;
  }
  const k = t.dataset && t.dataset.in; if (!k) return;
  if (k === 'kg' || k === 'reps'){ if (!ATIVO) return; const it = ATIVO.itens[+t.dataset.i], s = it.sets[+t.dataset.s]; s[k] = k === 'kg' ? t.value.trim().replace(',', '.') : t.value.trim(); saveAtivo();

  else if (k === 'bibq'){ S.bibQ = t.value; $('#biblist').innerHTML = bibList(); }
  else if (k === 'fcSlide'){ const v = t.value, top = $('#fc-top'), ln = $('#fc-line'); if (top) top.style.clipPath = `inset(0 0 0 ${v}%)`; if (ln) ln.style.left = v + '%'; }

  if (k === 'avatar'){ setAvatar(t.files && t.files[0]); return; }
  if (k === 'sysSexo'){ S.sys.sexo = t.value; Store.persistLocal(); t.blur(); render(); return; }
  if (k === 'sysPeso'){ S.sys.peso = t.value.replace(',','.').replace(/[^\d.]/g,''); Store.persistLocal(); t.blur(); render(); return; }
  if (k === 'sysTema'){ S.sys.tema = t.checked; Store.persistLocal(); render(); return; }
  if (k === 'fishOn'){ FISH.set({on:t.checked}); return; }
  if (k === 'fishUrl'){ const v = t.value.trim().replace(/\/+$/, ''); if (v && !/^https:\/\//.test(v)){ toast('O endereço precisa começar com https://'); return; } FISH.set({url:v}); toast(v ? 'Servidor de voz salvo.' : 'Servidor de voz removido.'); return; }
  if (k === 'fishToken'){ FISH.set({token:t.value.trim()}); toast('Senha do servidor salva neste aparelho.'); return; }
  if (k === 'fishVel'){ FISH.set({vel:t.value}); return; }
  if (k === 'mentorFoto'){ mentorFoto(t.files && t.files[0]); t.value = ''; return; }
  if (k === 'mentorAv'){ const f = t.files && t.files[0]; if (f) compressImg(f, 320, .85).then(d => { if (!LS.set('bb_mentor_av', d)) toast('Imagem grande demais.'); mentorRender(); }).catch(() => toast('Não consegui abrir essa imagem.')); return; }
  if (k === 'mentorNome'){ S.sys.mentorNome = t.value.trim().slice(0, 24); Store.persistLocal(); t.blur(); mentorRender(); return; }
  if (k === 'mentorVoz'){ S.sys.mentorVoz = t.checked; Store.persistLocal(); if (!t.checked) mentorParar(); return; }
  if (k === 'mentorVozId'){ S.sys.mentorVozId = t.value; Store.persistLocal(); t.blur(); return; }
  if (k === 'sysSom'){ S.sys.som = t.checked; Store.persistLocal(); if (t.checked) SFX.serie(); return; }
  if (k === 'fcA' || k === 'fcB'){ FCMP[k === 'fcA' ? 'a' : 'b'] = t.value; t.blur(); render(); return; }
  if (k === 'sysDescModo'){ S.sys.descModo = t.value; Store.persistLocal(); t.blur(); render(); return; }
  if (k === 'sysDescComp' || k === 'sysDescIso'){ const v = Math.min(600, Math.max(15, parseInt(t.value) || (k === 'sysDescComp' ? 150 : 75))); S.sys[k === 'sysDescComp' ? 'descComp' : 'descIso'] = v; Store.persistLocal(); t.blur(); render(); return; }
  if (k === 'importBk'){ if (t.files && t.files[0]) readBackup(t.files[0]); return; }
  if (k === 'cmpA' || k === 'cmpB' || k === 'medKey'){ S[k] = t.value; t.blur(); render(); return; }
  if (k === 'freq'){ t.blur(); savePerfil({freqMed:t.value}); return; }
  if (k === 'div'){ const div = {...(S.perfil.divisao||{})}; div[t.dataset.d] = t.value; t.blur(); savePerfil({divisao:div}); }

});

/* =========================================================
   BLOQUEIO
   ========================================================= */
let PIN = '';
const PIN_HASHES = ['2uhmkr', '1nu5s9e', '1h20oau']; // três códigos da família
function pinHash(s){ let x = 0x811c9dc5; for (const c of 'momofit:' + s){ x ^= c.codePointAt(0); x = Math.imul(x, 0x01000193) >>> 0; } return x.toString(36); }
function drawPin(){ $$('#pin i').forEach((el,i) => el.classList.toggle('on', i < PIN.length)); }
function pinPress(d){
  if (d === 'del') PIN = PIN.slice(0,-1); else if (PIN.length < 4) PIN += d;
  drawPin(); $('#lockmsg').textContent = '';
  if (PIN.length === 4) setTimeout(checkPin, 140);
}
function checkPin(){
  if (PIN_HASHES.includes(pinHash(PIN))){ LS.set('bb_unlocked', true); PIN = ''; drawPin(); unlock(); }
  else { const p = $('#pin'); p.classList.add('shake'); setTimeout(() => { p.classList.remove('shake'); PIN = ''; drawPin(); $('#lockmsg').textContent = 'Código incorreto. Tente de novo.'; }, 420); }
}
function showLock(){ $('#app').hidden = true; $('#rest').hidden = true; $('#lock').hidden = false; }
function unlock(){
  const h = (location.hash || '').slice(1); if (h && VIEWS[h]) S.view = h;
  $('#lock').hidden = true; $('#app').hidden = false; render(); if (REST) tickRest();
}

  const items = [
    [8,56,34,0,.09],[22,34,26,1,.07],[36,72,44,0,.06],[50,42,30,1,.08],[64,30,24,0,.07],[78,60,38,1,.08],[90,38,28,0,.07],
    [15,26,22,1,.08],[44,22,26,0,.07],[70,30,20,1,.08],[86,24,30,0,.07]

}
(function boot(){

  $('#keypad').addEventListener('click', e => { const b = e.target.closest('[data-key]'); if (b) pinPress(b.dataset.key); });

  const r = LS.get('bb_rest', null); if (r && r.end > Date.now() - 5000) REST = r; else LS.del('bb_rest');
  if (LS.get('bb_unlocked', false) === true) unlock(); else showLock();
  drawSync();
  Store.init();
  // outra aba do app mudou algo: recarrega na hora
  window.addEventListener('storage', e => {
    if (e.key === DATA_KEY){ Store.loadLocal(); refresh(); }
    else if (e.key === 'bb_ativo'){ ATIVO = LS.get('bb_ativo', null); if (S.view === 'treino') render(); }
  });
  // garante a última gravação ao fechar/minimizar
  const flush = () => { if (ATIVO) LS.set('bb_ativo', ATIVO); if (DRAFT) draftSave(); };

<script>

(function(){
  if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
