<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DYNAMICA FITNESS</title>
<meta name="description" content="DYNAMICA FITNESS: fichas de treino, cargas, evolução, peso e medidas.">
<meta name="theme-color" content="#0B0C0E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DYNAMICA FITNESS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: coluna única mobile-first (máx. 560px), cabeçalho fixo, navegação inferior com botão-anilha central. Visual grafite e aço, monocromático como a logo Dynamica; tema escuro fixo por escolha de marca. */
:root{
  --bg:#0B0C0E; --bg2:#141619; --bg3:#1D2024; --line:#2B2F35; --fg:#F2F4F6; --muted:#8C949D;
  --accent:#F2F4F6; --accent-2:#9AA7B4; --accent-ink:#0B0C0E; --steel:#C9CFD6;
  --ok:#4ADE9B; --warn:#F5B942; --bad:#F2716B;
  --body:#1F2226; --muscle:#343A41; --plate:#121417; --grid:rgba(255,255,255,.035); --glow:rgba(255,255,255,.10);
  --bun:#D9DEE3; --bun-line:#0B0C0E; --bun-in:#9AA7B4; --blush:#9AA7B4; --white:#FFFFFF;
  --f-display:"Saira","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:18px; --r-sm:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
/* sem zoom por toque duplo: o toque vira clique direto */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,textarea,label{touch-action:manipulation}
body{
  background-color:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.45;
  background-image:
    radial-gradient(120% 50% at 50% -10%, var(--glow), transparent 60%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:100% 100%, 28px 28px, 28px 28px;
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.7rem;font-weight:800;letter-spacing:.01em}
h2{font-size:1.08rem;font-weight:700}
h3{font-size:.92rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Halteres animados no fundo ---------- */
#bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bgfx span{position:absolute;left:0;color:var(--accent);opacity:var(--o,.16);animation:drift var(--d,30s) linear infinite;animation-delay:var(--dl,0s);will-change:transform}
#bgfx span.rev{animation-name:driftRev}
#bgfx span.hrt{color:var(--accent-2)}
#bgfx svg{display:block;width:100%;height:auto;animation:bob var(--b,3.4s) ease-in-out infinite}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw + 140px))}}
@keyframes driftRev{from{transform:translateX(calc(100vw + 140px))}to{transform:translateX(-140px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-12px) rotate(10deg)}}
#app{position:relative;z-index:1}

/* ---------- Lock ---------- */
#lock{position:fixed;inset:0;z-index:50;background:transparent;display:flex;align-items:center;justify-content:center;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lock-in{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.lock-in .mascot{width:132px;height:auto;filter:drop-shadow(0 10px 30px var(--glow))}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.7rem;letter-spacing:.02em}
.brand b{color:var(--accent)}
#pin{display:flex;gap:14px;margin:6px 0 2px}
#pin i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:.15s}
#pin i.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px var(--glow)}
#pin.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#lockmsg{min-height:1.3em;font-size:.88rem;color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;margin-top:4px}
.key{width:74px;height:74px;border-radius:50%;border:3px solid var(--line);background:var(--plate);
  box-shadow:inset 0 0 0 7px var(--plate), inset 0 0 0 9px var(--line), 0 6px 16px rgba(0,0,0,.18);
  font-family:var(--f-mono);font-weight:700;font-size:1.45rem;display:grid;place-items:center;transition:transform .08s, border-color .15s}
.key:active{transform:scale(.94);border-color:var(--accent)}
.key.ghost{visibility:hidden}
.key.del{font-size:1rem}
.lock-hint{font-size:.8rem;color:var(--muted)}
.avatar{display:block;width:100%;height:100%;object-fit:cover;border-radius:28px;border:3px solid var(--accent);box-shadow:0 0 0 6px var(--glow),0 12px 30px var(--glow);background:var(--bg2)}
#lock-m{display:grid;place-items:center}
#lock-m .avatar{width:150px;height:150px}
.brandlogo{width:min(300px,76vw);height:auto;display:block}
img.mascot{object-fit:contain}
.hlogo{display:flex;align-items:center;gap:9px}.hwords{display:flex;flex-direction:column;align-items:stretch;gap:3px}.hfit{font-family:var(--f-body);font-size:.5rem;letter-spacing:.2em;color:var(--fg);font-weight:600;white-space:nowrap;opacity:.85}.hlogo img{display:block}
#lock-m .mascot{width:132px}
.hello-m{width:104px;height:104px;display:grid;place-items:center;background:none;border:0;padding:0}
.hello-m .avatar{border-radius:24px}
.av-prev{width:72px;height:72px;flex:none;display:grid;place-items:center}
.av-prev .mascot{width:72px}
.sync.flash{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.08);border-color:var(--ok)}}
.sync.err i{background:var(--bad)}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table.cmp{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.cmp th{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:6px}
.cmp td{padding:9px 6px;border-top:1px solid var(--line);text-align:right;font-family:var(--f-mono);white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left;font-family:var(--f-body);font-weight:600;white-space:normal}
.cmp td.df{color:var(--accent);font-weight:700}
.headline{font-size:1rem;font-weight:600;line-height:1.5}
.headline b{color:var(--accent);font-family:var(--f-mono)}
.medrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.medrow:first-child{border-top:0}
.medrow small{display:block;color:var(--muted);font-size:.78rem;font-family:var(--f-mono)}
.kpi .dl{font-family:var(--f-mono);font-size:.72rem;color:var(--accent)}
.draft{font-size:.8rem;color:var(--accent)}
/* ---------- Dieta ---------- */
.daynav{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:center}
.daynav div{display:flex;flex-direction:column;gap:2px}
.daynav b{text-transform:capitalize}
.daynav span{font-size:.78rem;color:var(--muted)}
.daynav .icon-btn:disabled{opacity:.35}
.macros{display:flex;flex-direction:column;gap:10px;min-width:0}
.mrow{display:flex;flex-direction:column;gap:4px}
.mrow span{font-size:.84rem;font-weight:600}
.mrow b{font-size:.8rem}
.mbar{height:8px;border-radius:99px;background:var(--bg3);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.water{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.water button{aspect-ratio:1;max-width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--line);display:grid;place-items:center;padding:0}
.water button svg{width:58%;height:58%}
.water button.on{color:#4FB7FF;border-color:color-mix(in srgb,#4FB7FF 50%,var(--line));background:color-mix(in srgb,#4FB7FF 12%,var(--bg))}
.agok{color:var(--ok)}
.meal .kc{color:var(--accent);font-size:.95rem;white-space:nowrap}
.flist{display:flex;flex-direction:column}
.fitem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.fitem:first-child{border-top:0}
.fitem:has(.icon-btn){grid-template-columns:1fr auto auto}
.fitem span{display:flex;flex-direction:column;gap:2px;min-width:0}
.fitem span:last-of-type{align-items:flex-end;text-align:right}
.fitem small{font-size:.74rem;color:var(--muted);font-family:var(--f-mono)}
.fitem .icon-btn{width:32px;height:32px}
.placar{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.dchips{display:flex;flex-wrap:wrap;gap:5px}
.dlist{display:flex;flex-direction:column}
.dday{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;width:100%}
.dday:first-child{border-top:0}
.dinfo{display:flex;flex-direction:column;gap:6px;min-width:0}
.dinfo b{text-transform:capitalize}
.score{width:56px;height:56px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--line);flex:none}
.score b{font-family:var(--f-mono);font-size:1rem;line-height:1}
.score small{font-size:.58rem;color:var(--muted);letter-spacing:.06em}
.score.part{border-color:var(--accent-2)}
.score.full{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.score.full b{color:var(--ok)}
/* ---------- Destaques ---------- */
.hverse{text-align:left;width:100%;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--bg2)),var(--bg2));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.hverse .eyebrow{display:flex;align-items:center;gap:6px;color:var(--accent)}
.hverse .eyebrow svg{width:14px;height:14px}
.vtxt{font-family:Georgia,"Times New Roman",serif;font-size:1.06rem;line-height:1.55;font-style:italic}
.vref{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);letter-spacing:.06em}
.vrefl{font-size:.9rem;color:var(--muted);border-left:3px solid var(--accent-2);padding-left:10px}
.verse{display:flex;flex-direction:column;gap:8px}
.verse.big .vtxt{font-size:1.22rem}
.bible-hero{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,var(--bg2)),var(--bg2) 60%)}
.vlist{display:flex;flex-direction:column}
.vlist .verse{padding:12px 0;border-top:1px solid var(--line)}
.vlist .verse:first-child{border-top:0}
.chat{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow-y:auto;padding:4px 2px}
.msg{max-width:88%;padding:10px 12px;border-radius:16px;font-size:.92rem;white-space:pre-wrap;line-height:1.45}
.msg.ai{align-self:flex-start;background:var(--bg3);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.saints{display:flex;flex-direction:column;gap:10px}
.saint{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.saint p{font-family:Georgia,serif;font-style:italic}
.saint small{color:var(--muted);font-size:.78rem}
/* ---------- Mais ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px}
.tile .tic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tile .tic svg{width:22px;height:22px}
.tile small{color:var(--muted);font-size:.78rem}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchips button{border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:7px 11px;font-size:.84rem;font-weight:600}
.mchips button.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mchips button.s{border-color:var(--accent-2);color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 14%,transparent)}
#install{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:35;width:min(528px,calc(100% - 32px));background:var(--bg2);border:1px solid var(--accent);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;box-shadow:0 12px 30px var(--glow)}
#install img{width:42px;height:42px;border-radius:11px}
#install p{font-size:.84rem;line-height:1.35}
#install .row{flex-wrap:nowrap;gap:6px}

/* ---------- Header / nav ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:.03em}
.logo b{color:var(--accent)}
.logo svg{width:26px;height:26px}
.top-r{display:flex;align-items:center;gap:8px}
.sync{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;border:1px solid var(--line);padding:4px 8px;border-radius:99px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.sync.cloud i{background:var(--ok)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
main{padding-block:16px 150px}
#view{display:flex;flex-direction:column;gap:16px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-top:6px;padding-bottom:8px}
.nb{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--muted);padding:4px 0}
.nb svg{width:22px;height:22px}
.nb.on{color:var(--accent)}
.nb.go{margin-top:-26px}
.nb.go .plate{width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  box-shadow:inset 0 0 0 5px var(--accent), inset 0 0 0 7px color-mix(in srgb,var(--accent-ink) 30%,transparent), 0 8px 24px var(--glow);border:3px solid var(--bg)}
.nb.go .plate svg{width:28px;height:28px}
.nb.go.live .plate{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 5px var(--accent), inset 0 0 0 7px color-mix(in srgb,var(--accent-ink) 30%,transparent), 0 0 0 10px var(--glow)}}

/* ---------- Generic ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:1px solid var(--line);background:var(--bg3);border-radius:14px;padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px var(--glow)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:.86rem;border-radius:11px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.72rem;padding:3px 8px;border-radius:99px;background:var(--bg3);border:1px solid var(--line);color:var(--fg);white-space:nowrap}
.chip.acc{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.tabs{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:700;font-size:.86rem;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.8rem;font-weight:700;color:var(--muted)}
.input,select.input,textarea.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px;font-size:16px}
textarea.input{min-height:120px;resize:vertical}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--glow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:22px 12px}
.empty-state .mascot{width:110px}
.note{font-size:.84rem;color:var(--muted)}
.banner{border:1px dashed color-mix(in srgb,var(--warn) 60%,var(--line));color:var(--fg);background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:14px;padding:10px 12px;font-size:.84rem}

/* ---------- Home ---------- */
.hello{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.hello-txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.hello-m .mascot{width:104px;height:auto;filter:drop-shadow(0 8px 22px var(--glow))}
.bubble{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:9px 12px;font-weight:600;font-size:.9rem;align-self:flex-start}
.resume{display:flex;align-items:center;gap:10px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg2));color:var(--fg);border-radius:16px;padding:12px 14px;font-weight:700;text-align:left}
.resume svg{width:20px;height:20px;color:var(--accent);flex:none}
.today{position:relative;overflow:hidden}
.today-top{display:flex;gap:14px;align-items:center}
.letter{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:#1B0E19;
  box-shadow:inset 0 0 0 5px rgba(255,255,255,.28), inset 0 0 0 7px rgba(0,0,0,.12)}
.letter.sm{width:44px;height:44px;font-size:1.05rem;box-shadow:inset 0 0 0 3px rgba(255,255,255,.28), inset 0 0 0 5px rgba(0,0,0,.12)}
.today-meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.week{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:112px;height:112px}
.ring .trk{fill:none;stroke:var(--bg3);stroke-width:12}
.ring .bar{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dasharray .6s}
.ring .rim{fill:none;stroke:var(--line);stroke-width:1.5}
.ring .tick{stroke:var(--line);stroke-width:2}
.ring text{fill:var(--fg);font-family:var(--f-mono);font-weight:700}
.ring .sub{fill:var(--muted);font-size:8px;font-family:var(--f-body);font-weight:600;letter-spacing:.06em}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.day i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.day.on i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.on i svg{width:14px;height:14px}
.day.today span{color:var(--accent);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;color:var(--muted);line-height:1.2}
.pr-list{display:flex;flex-direction:column}
.pr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr .tro{width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);display:grid;place-items:center}
.pr .tro svg{width:18px;height:18px}
.pr strong{display:block;font-size:.92rem}
.pr small{color:var(--muted);font-size:.78rem}

/* ---------- Fichas ---------- */
.ficha{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;width:100%}
.ficha .fm{display:flex;flex-direction:column;gap:2px;min-width:0}
.ficha .fm span{color:var(--muted);font-size:.84rem}
.ficha svg.chev{width:20px;height:20px;color:var(--muted)}
.topbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.tb-title{display:flex;gap:10px;align-items:center;min-width:0}
.tb-title div{min-width:0}
.tb-title p{color:var(--muted);font-size:.86rem}
.exlist{display:flex;flex-direction:column;gap:8px}
.exrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px}
.exn{font-family:var(--f-mono);font-weight:700;color:var(--accent);font-size:.86rem;padding-top:2px;min-width:20px}
.exmain{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.exmain strong{font-size:.98rem}
.exmain .chips{display:flex;gap:5px;flex-wrap:wrap}
.exmain .obs{font-size:.8rem;color:var(--muted)}
.exmain .mus{font-size:.76rem;color:var(--accent-2)}
.exctl{display:flex;flex-direction:column;gap:4px}
.exctl button{width:32px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);display:grid;place-items:center}
.exctl svg{width:16px;height:16px}
.divrow{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center}
.divrow b{font-size:.9rem}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);font-size:1.2rem;font-weight:700}
.stepper b{font-family:var(--f-mono);font-size:1.3rem;min-width:28px;text-align:center}
.vol{display:flex;flex-direction:column;gap:12px}
.vrow{display:flex;flex-direction:column;gap:5px}
.vrow .between span{font-size:.88rem;font-weight:600}
.vbar{position:relative;height:12px;border-radius:99px;background:var(--bg3);overflow:hidden}
.vbar .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 22%,transparent);border-left:1px dashed var(--ok);border-right:1px dashed var(--ok)}
.vbar .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:99px;background:var(--accent)}
.alert{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.alert svg{width:18px;height:18px;color:var(--warn);flex:none;margin-top:1px}
.alert.ok{background:color-mix(in srgb,var(--ok) 10%,transparent);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.alert.ok svg{color:var(--ok)}

/* ---------- Treino ativo ---------- */
.wk-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:10;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 24px rgba(0,0,0,.12)}
.wk-head .between h2{font-size:1rem}
.clock{font-family:var(--f-mono);font-weight:700;font-size:1.05rem;color:var(--accent)}
.prog{height:8px;border-radius:99px;background:var(--bg3);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .3s}
.ex-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-card.complete{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.ex-h{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.ex-h .exn{font-size:1rem}
.ex-h .nm{background:none;border:0;padding:0;text-align:left;font-weight:700;font-size:1.02rem;display:flex;flex-direction:column;gap:4px;min-width:0}
.ex-h .nm small{font-family:var(--f-mono);font-weight:500;font-size:.74rem;color:var(--muted)}
.ex-h .icon-btn{width:34px;height:34px;border-radius:10px}
.lastline{font-size:.8rem;color:var(--muted);font-family:var(--f-mono)}
.sug{display:flex;gap:8px;align-items:flex-start;font-size:.84rem;background:color-mix(in srgb,var(--accent) 9%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);padding:8px 10px;border-radius:12px}
.sug svg{width:16px;height:16px;color:var(--accent);flex:none;margin-top:2px}
.sets{display:flex;flex-direction:column;gap:6px}
.set-h,.set-r{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:8px;align-items:center}
.set-h{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:0 2px}
.set-r .sn{font-family:var(--f-mono);font-weight:700;text-align:center;color:var(--muted);position:relative}
.set-r input{width:100%;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:17px;background:var(--bg);border:1px solid var(--line);border-radius:11px;min-height:44px;padding:6px}
.set-r input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.chk{height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg3);display:grid;place-items:center;color:var(--muted)}
.chk svg{width:20px;height:20px}
.set-r.done .chk{background:var(--ok);border-color:var(--ok);color:#06281C}
.set-r.done input{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.set-r.done .sn{color:var(--ok)}
.prtag{position:absolute;left:50%;top:-9px;transform:translateX(-50%);font-size:.55rem;background:var(--warn);color:#2A1B00;border-radius:5px;padding:0 3px;letter-spacing:.04em}
.ex-f{display:flex;gap:8px}
.warmup{font-size:.84rem;display:flex;gap:10px;align-items:flex-start}
.warmup svg{width:18px;height:18px;color:var(--accent);flex:none;margin-top:2px}
#rest{position:fixed;z-index:48}
#rest.mini{z-index:30;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(528px,calc(100% - 32px));background:var(--bg2);border:1px solid var(--accent);border-radius:18px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;box-shadow:0 12px 30px var(--glow);cursor:pointer}
#rest.mini.end{border-color:var(--ok)}
#rest.full{inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rest-card{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.rest-card h2{font-size:1.15rem}
.rest-ring{width:min(240px,64vw);position:relative}
.rest-ring svg{width:100%;height:auto;display:block}
.rest-ring .t{fill:none;stroke:var(--bg3);stroke-width:9}
.rest-ring .b{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dasharray .45s linear}
.rest-ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.rest-ring .big{font-family:var(--f-mono);font-weight:700;font-size:clamp(2.6rem,14vw,3.6rem);color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.rest-ring .sm{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;color:var(--muted)}
#rest.full.end .b{stroke:var(--ok)}
#rest.full.end .big{color:var(--ok);font-size:clamp(2.2rem,11vw,2.9rem)}
#rest.full.end .rest-card{animation:pop .6s}
.rest-next{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;display:flex;flex-direction:column;gap:2px}
.rest-next span{font-size:.78rem;color:var(--muted);font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.rest-next b{font-size:1rem}
#rest.full.end .rest-next{border-color:var(--ok)}
.rest-adj{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.rest-card .btn.block{min-height:52px;font-size:1rem}
#rest .rt{font-family:var(--f-mono);font-weight:700;font-size:1.5rem;color:var(--accent);font-variant-numeric:tabular-nums}
#rest.end .rt{color:var(--ok)}
#rest .rl{font-size:.8rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rest svg.rr{width:38px;height:38px}
#rest .rr .t{fill:none;stroke:var(--bg3);stroke-width:5}
#rest .rr .b{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:20px 20px}
#rest.end .rr .b{stroke:var(--ok)}

/* ---------- Evolução ---------- */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--f-mono);font-size:9px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--bg2);stroke:var(--accent);stroke-width:2}
.chart .pt.end{fill:var(--accent);stroke:var(--bg2);stroke-width:3}
.chart .vl{fill:var(--fg);font-family:var(--f-mono);font-size:11px;font-weight:700}
.chart .ar-s{stop-color:var(--accent)}
.chart .bar{fill:var(--accent)}
.chart .bar.dim{fill:var(--muted);opacity:.35}
.chart .meta{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:4 4}
.chart .metat{fill:var(--ok);font-family:var(--f-mono);font-size:9px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:.72rem;color:var(--muted)}
.kpi b{font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.kpi b.up{color:var(--ok)}
.kpi b.down{color:var(--bad)}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.86rem}
.hrow:first-child{border-top:0}
.hrow .d{font-family:var(--f-mono);color:var(--muted);font-size:.78rem}
.hrow .s{font-family:var(--f-mono);font-size:.8rem;display:flex;flex-wrap:wrap;gap:4px 10px}
.hrow .s b{color:var(--accent)}

/* ---------- Biblioteca / info ---------- */
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{padding-left:38px}
.gchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.gchips button{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:7px 12px;font-weight:600;font-size:.84rem}
.gchips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lib-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.lib-item small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.lib-item svg{width:18px;height:18px;color:var(--muted)}
.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px 6px 8px;position:relative;overflow:hidden}
.bodymap figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.bodymap svg{width:100%;max-width:150px;height:auto}
.bodymap figcaption{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.14em;color:var(--muted)}
.bodymap::after{content:"";position:absolute;left:0;right:0;height:40px;top:-40px;background:linear-gradient(180deg,transparent,var(--glow),transparent);animation:scan 3.2s ease-in-out infinite;pointer-events:none}
@keyframes scan{0%{top:-40px}100%{top:100%}}
.bd{fill:var(--body)}
.mz{fill:var(--muscle);transition:fill .3s}
.mz.p{fill:var(--accent)}
.mz.s{fill:var(--accent-2);opacity:.6}
.absl{stroke:var(--body);stroke-width:1.3;fill:none}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.84rem}
.legend div{display:flex;gap:8px;align-items:flex-start}
.legend i{width:12px;height:12px;border-radius:4px;flex:none;margin-top:4px}
.legend i.p{background:var(--accent)}
.legend i.s{background:var(--accent-2);opacity:.7}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:8px}
ol.steps li{counter-increment:st;display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:.92rem}
ol.steps li::before{content:counter(st);font-family:var(--f-mono);font-weight:700;font-size:.78rem;width:24px;height:24px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:grid;place-items:center}
ul.dots{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
ul.dots li{display:grid;grid-template-columns:16px 1fr;gap:6px}
ul.dots li::before{content:"";width:7px;height:7px;border-radius:2px;margin-top:8px;background:var(--bad)}
ul.dots.tip li::before{background:var(--ok)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--bg3);font-weight:700;color:var(--fg);text-decoration:none;font-size:.9rem}
.links a.yt{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.links svg{width:18px;height:18px}
.ai-ans{white-space:pre-wrap;font-size:.92rem;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:3em}
.src{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase}

/* ---------- Sheet / toast ---------- */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,4,9,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet-p{width:100%;max-width:600px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s ease-out;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet-c{display:flex;flex-direction:column;gap:16px}
.sheet-h{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h3{font-size:.8rem;font-family:var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--fg)}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 8%,transparent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.summary{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.summary .mascot{width:130px}
.parse-f{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.parse-f ul{margin:0;padding-left:18px;font-size:.84rem;color:var(--muted)}

/* ---------- Sistema (janela de status estilo RPG: fundo #0a0e17, borda azul neon) ---------- */
body.sys-theme{--bg:#0a0e17;--bg2:#0f1522;--bg3:#152036;--line:#1d2b45;--accent:#00a8ff;--accent-2:#5cc8ff;--accent-ink:#001019;--glow:rgba(0,168,255,.16);--grid:rgba(0,168,255,.045);--muted:#8a9bb5}
.sysw{width:100%;text-align:left;color:#dbeeff;background:linear-gradient(180deg,rgba(0,168,255,.07),transparent 45%),#0a0e17;border:1px solid #00a8ff;border-radius:6px;padding:16px;
  box-shadow:0 0 0 1px rgba(0,168,255,.12),0 0 18px rgba(0,168,255,.22),inset 0 0 22px rgba(0,168,255,.07);display:flex;flex-direction:column;gap:10px}

function mmss(sec){ sec = Math.max(0, Math.round(sec)); return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); }
function hhmmss(sec){ const h = Math.floor(sec/3600); return h ? h + ':' + mmss(sec%3600).padStart(5,'0') : mmss(sec); }

function matchLib(name){
  const n = norm(name); if (!n) return null;
  const nb = '-' + n + '-';
  let best = null, bs = 0;
  for (const e of LIB){
    for (const c of e.aliases){
      let s = 0;
      if (c === n) s = 1000;
      else if (nb.includes('-' + c + '-')) s = 50 + c.length;
      else if (c.startsWith(n + '-') && n.length >= 5) s = 30 + n.length;
      if (s > bs){ bs = s; best = e; }
    }
  }
  return bs >= 35 ? best : null;
}
function getInfo(name){ const k = norm(name); return (k && S.bib[k]) || matchLib(name) || null; }
function histKey(name){ const m = matchLib(name); return m ? m.key : norm(name); }

/* Salvamento automático: tudo vive no localStorage deste navegador.
   Cada alteração grava na hora (Store.put/remove → persistLocal) e o app carrega tudo ao abrir (Store.loadLocal). */
const DATA_KEY = 'bb_data';
const Store = {
  ai:null, aiImages:false, aiTypes:[], ok:true, lastSave:0,
  async init(){
    const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(()=>{}); } catch(e){}
    const ai = await use('sample');
    if (ai){ this.ai = ai; try{ const lim = await ai.limits(); this.aiImages = !!(lim && lim.images); this.aiTypes = (lim && lim.images && lim.images.mediaTypes) || []; }catch(e){} }
    refresh();
  },
  loadLocal(){
    const d = LS.get(DATA_KEY, null) || {};
    S.fichas = (d.fichas||[]).sort(byOrdem); S.sessoes = (d.sessoes||[]).sort((a,b)=>a.ts-b.ts); S.bib = d.bib||{};
    S.medidas = (d.medidas||[]).sort((a,b)=>a.ts-b.ts);
    S.perfil = {...clone(DEFAULT_PERFIL), ...(d.perfil||{})};
    S.dieta = d.dieta ? {...defaultDieta(), ...d.dieta} : defaultDieta();
    S.diario = d.diario || {}; S.foods = d.foods || {};
    S.sys = {...defaultSys(), ...(d.sys||{})};
    this.lastSave = d.salvoEm || 0;
    if (!d.sys) setTimeout(() => this.persistLocal(), 0); // grava a data de ativação do Sistema
  },
  persistLocal(){
    const now = Date.now();
    const ok = LS.set(DATA_KEY, {app:'momofit', v:3, salvoEm:now, fichas:S.fichas, sessoes:S.sessoes, bib:S.bib, medidas:S.medidas, perfil:S.perfil, dieta:S.dieta, diario:S.diario, foods:S.foods, sys:S.sys});
    const was = this.ok; this.ok = ok; if (ok) this.lastSave = now;
    drawSync(true);
    if (!ok && was) toast('Não consegui salvar neste navegador. Saia da aba anônima ou libere espaço no celular.');
    return ok;
  },
  apply(col, id, data){
    if (col === 'fichas'){ const i = S.fichas.findIndex(f=>f.id===id); data ? (i>=0 ? S.fichas[i]=data : S.fichas.push(data)) : (i>=0 && S.fichas.splice(i,1)); S.fichas.sort(byOrdem); }
    else if (col === 'sessoes'){ const i = S.sessoes.findIndex(f=>f.id===id); data ? (i>=0 ? S.sessoes[i]=data : S.sessoes.push(data)) : (i>=0 && S.sessoes.splice(i,1)); S.sessoes.sort((a,b)=>a.ts-b.ts); }
    else if (col === 'biblioteca'){ data ? S.bib[id] = data : delete S.bib[id]; }
    else if (col === 'medidas'){ const i = S.medidas.findIndex(f=>f.id===id); data ? (i>=0 ? S.medidas[i]=data : S.medidas.push(data)) : (i>=0 && S.medidas.splice(i,1)); S.medidas.sort((a,b)=>a.ts-b.ts); }
    else if (col === 'config'){ S.perfil = {...clone(DEFAULT_PERFIL), ...(data||{})}; }
    else if (col === 'dieta'){ S.dieta = {...defaultDieta(), ...(data||{})}; }
    else if (col === 'diario'){ data ? S.diario[id] = data : delete S.diario[id]; }
    else if (col === 'alimentos'){ data ? S.foods[id] = data : delete S.foods[id]; }
  },
  async put(col, id, data){ this.apply(col, id, clone(data)); this.persistLocal(); refresh(); },
  async remove(col, id){ this.apply(col, id, null); this.persistLocal(); refresh(); }
};
function byOrdem(a,b){ return (a.ordem??0) - (b.ordem??0) || String(a.letra||'').localeCompare(String(b.letra||'')); }
function savePerfil(patch){ return Store.put('config', 'perfil', {...S.perfil, ...patch}); }

function avatarHTML(kind){ const a = LS.get('bb_avatar', null); return a ? `<img class="avatar" src="${esc(a)}" alt="Imagem de perfil">` : kind === 'lock' ? `<img class="brandlogo" src="${LOGO_FULL}" alt="DYNAMICA SOLUÇÕES FITNESS">` : mascot(); }
async function setAvatar(file){
  if (!file || !/^image\//.test(file.type)){ toast('Escolha um arquivo de imagem.'); return; }
  try {
    const url = URL.createObjectURL(file); const img = new Image(); img.src = url; await img.decode();
    const max = 420, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    let data = c.toDataURL('image/webp', .85); if (!data.startsWith('data:image/webp')) data = c.toDataURL('image/jpeg', .85);
    if (!LS.set('bb_avatar', data)){ toast('Imagem grande demais para salvar. Tente outra.'); return; }
    $('#lock-m').innerHTML = avatarHTML('lock'); toast('Imagem salva!'); openSettings(); render();
  } catch(e){ toast('Não consegui abrir essa imagem.'); }
}

  const dl = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads').catch(()=>null) : null;
  if (dl){
    try { const r = await dl.save({filename, data}); if (r && r.status === 'saved') toast('Backup salvo no aparelho.'); return; }
    catch(e){ if (e && e.code === 'declined') return; }
  }
  if (!(window.claude && typeof window.claude.use === 'function')){
    try {

function readBackup(file){

/* =========================================================

function histFor(key){
  const out = [];
  for (const s of S.sessoes){ const it = (s.itens||[]).find(i => i.key === key); if (it) out.push({ts:s.ts, id:s.id, nome:it.nome, sets:it.sets||[], deload:!!s.deload}); }
  return out.sort((a,b)=>a.ts-b.ts);
}
function bestKg(sets){ return Math.max(0, ...sets.map(x => +x.kg||0)); }

function allPRs(){
  const out = [], best = {};
  for (const s of S.sessoes) for (const it of (s.itens||[])){
    const mk = bestKg(it.sets||[]);
    if (best[it.key] !== undefined && mk > best[it.key]) out.push({key:it.key, nome:it.nome, kg:mk, prev:best[it.key], ts:s.ts});
    best[it.key] = Math.max(best[it.key] ?? 0, mk);
  }
  return out.reverse();
}
function sessVolume(s){ let v = 0; for (const it of (s.itens||[])) for (const st of (it.sets||[])) v += (+st.kg||0) * (+st.reps||0); return v; }

  F:{agach:[0.7,1.05,1.4,1.75,2.2], supino:[0.4,0.65,0.9,1.15,1.4], terra:[0.9,1.3,1.7,2.1,2.5], remada:[0.35,0.55,0.75,0.95,1.2]}
};
const LIFTS = [['agach','Agachamento'],['supino','Supino reto'],['terra','Levantamento terra'],['remada','Remada curvada']];

const CARDIO_RX = /esteira|bike|bicicleta|corrida|remo|eliptico|escada|zona-2|circuito|amrap|burpee|swing|sled|farmer|corda|hiit|tiros|caminhada|cardio/;
function defaultSys(){ return {inicio:Date.now(), sexo:'M', peso:'', missoes:{}, justif:{}, seen:null, tema:true,
  rm:null, rankConf:null, prova:null, cooldown:0, provasHist:[], deload:null, deloads:[], descModo:'auto', descComp:150, descIso:75, som:true, titulos:{}, titulo:'', inv:[], invHoje:null}; }
function liftOf(name){
  const n = norm(name);
  if (/agachamento/.test(n) && !/bulgaro|goblet|afundo|hack|sissy|pistol|smith|halter/.test(n)) return 'agach';
  if (/supino/.test(n) && !/inclinad|declinad|halter|maquina|fechado|smith/.test(n)) return 'supino';
  if (/(^|-)terra($|-)/.test(n) && !/romeno|stiff|halter/.test(n)) return 'terra';

function sysScheduled(ts){ const id = (S.perfil.divisao||{})[new Date(ts).getDay()]; return !!(id && S.fichas.some(f => f.id === id)); }
function temDivisao(){ return [0,1,2,3,4,5,6].some(d => { const id = (S.perfil.divisao||{})[d]; return id && S.fichas.some(f => f.id === id); }); }
function protMeta(){ return +S.dieta.metaP || Math.round(1.8 * (sysPeso() || 0)); }

    {id:'prot', nome:'Proteína', auto:true, ok: pm > 0 && p >= pm*0.9, txt: pm ? `${fmt(p,0)} / ${pm} g` : 'defina a meta na Dieta'},
    {id:'mob', nome:'Mobilidade (10 min)', auto:false, ok: !!man.mob},

function misRows(ms){

      : `<button class="mk" data-act="sysMis" data-m="${m.id}" aria-pressed="${m.ok}" aria-label="Marcar ${esc(m.nome)}">${m.max ? (m.ok ? '✓' : m.n ? m.n + '/' + m.max : '') : m.ok ? '✓' : ''}</button>`}

function homeMissoes(){

  return `<section class="sysw"><div class="between"><p class="sys-h">[ MISSÕES DE HOJE ] ${n}/${ms.length}</p><span class="sys-m">+${n*2 + (n === ms.length ? 5 : 0)} XP</span></div>
    ${misRows(ms)}<p class="sys-m">Cada missão: +2 XP. Todas no mesmo dia: +5 XP de bônus.</p></section>`;

/* Faltas: dia programado na divisão sem treino. Tolerância: treinar no dia seguinte, se ele for folga. */
function sysFaltas(){
  if (!temDivisao()) return [];
  const inicio = dayStart(S.sys.inicio || Date.now()), hoje = dayStart(Date.now());
  const treinou = new Set(S.sessoes.filter(s => sessSets(s) > 0).map(s => dayKey(s.ts)));
  const out = [];
  for (let t = inicio; t < hoje; t = addDays(t, 1)){
    if (!sysScheduled(t)) continue;
    const k = dayKey(t); if (treinou.has(k)) continue;
    const nx = addDays(t, 1), nxSched = sysScheduled(nx);
    if (!nxSched && treinou.has(dayKey(nx))) continue;
    if (nx >= hoje && !nxSched) continue; // ainda dá tempo de compensar hoje
    out.push({k, ts:t, just:(S.sys.justif||{})[k] || null});
  }

}
function sysOfensiva(sess){
  const treinou = new Set(sess.map(s => dayKey(s.ts))), div = temDivisao(), just = S.sys.justif || {};
  let n = 0, vazio = 0, t = dayStart(Date.now());
  if (!treinou.has(dayKey(t))) t = addDays(t, -1); // hoje ainda não acabou
  for (let i = 0; i < 400; i++, t = addDays(t, -1)){
    const k = dayKey(t);
    if (treinou.has(k)){ n++; vazio = 0; continue; }
    if (div){
      if (sysScheduled(t) && !just[k]){ const nx = addDays(t, 1); if (!sysScheduled(nx) && treinou.has(dayKey(nx))) continue; break; }
    } else if (++vazio >= 3) break;
  }
  return n;
}
function sysCalc(){
  const now = Date.now(), peso = sysPeso(), sexo = S.sys.sexo === 'F' ? 'F' : 'M', meta = +S.perfil.meta || 4;
  const sess = S.sessoes.filter(s => sessSets(s) > 0);
  const faltas = sysFaltas(), misses = faltas.filter(f => !f.just);
  const ledger = [], hist = {}, recentSets = [], longPRs = [];
  let penal = null, mi = 0;
  const reqPen = () => Math.max(16, Math.ceil(median(recentSets.slice(-5)) * 1.2));
  const pushMiss = m => { if (!penal) penal = {desde:m.k, n:0}; penal.n++; ledger.push({ts:m.ts, xp:0, tipo:'pen', txt:`Falta sem justificativa (${ddmm(m.ts)}): penalidade ativada`}); };
  for (const s of sess){
    const sd = dayKey(s.ts);
    while (mi < misses.length && misses[mi].k < sd) pushMiss(misses[mi++]);
    const sets = sessSets(s);
    let prog = 0; const det = [];
    for (const it of (s.itens||[])){
      const b = itemBest(it); if (!(b > 0)) continue;
      const k = it.key, core = !!liftOf(it.nome), h = hist[k];
      if (s.deload) continue; // semana de deload: só XP de manutenção, não mexe no histórico de progressão
      if (!h){ prog += 3; hist[k] = {best:b, bestTs:s.ts, recent:[b]}; continue; }
      const ref = Math.max(...h.recent);
      if (b > h.best * 1.005){
        const g = core ? 60 : 30; prog += g; det.push(`Recorde: ${it.nome} +${g}`);
        if (core && s.ts - h.bestTs >= 56*DIA_MS) longPRs.push({id:k+':'+s.ts, nome:it.nome, ts:s.ts, dias:Math.round((s.ts-h.bestTs)/DIA_MS)});
        h.best = b; h.bestTs = s.ts;
      } else if (b > ref * 1.005){ const g = core ? 20 : 10; prog += g; det.push(`Sobrecarga: ${it.nome} +${g}`); }
      h.recent.push(b); if (h.recent.length > 3) h.recent.shift();
    }
    let xp = (sets >= 6 ? 10 + Math.min(sets, 25) : Math.min(sets, 5)) + Math.min(prog, 150);
    if (penal){
      const req = reqPen();
      if (sets >= req){ xp += 20; det.push('Penalidade cumprida +20'); penal = null; }
      else { xp = Math.round(xp * 0.5); det.push(`Penalidade ativa: XP pela metade (eram ${req} séries)`); }
    }
    recentSets.push(sets);
    ledger.push({ts:s.ts, xp, tipo:'treino', txt:s.fichaNome || 'Treino', det, sid:s.id});
  }
  while (mi < misses.length) pushMiss(misses[mi++]);
  if (penal) penal.req = reqPen();
  // bônus de constância: semanas completas com a meta batida
  if (sess.length){
    const cur = weekStart(now); let streak = 0;
    for (let ws = weekStart(sess[0].ts); ws < cur; ws = addDays(ws, 7)){
      const we = addDays(ws, 7), n = sess.filter(s => s.ts >= ws && s.ts < we).length;
      if (n >= meta){ streak++; ledger.push({ts:we-1, xp:30 + 5*Math.min(streak-1, 6), tipo:'semana', txt:`Meta semanal batida (${n}/${meta})${streak>1?` · ${streak} semanas seguidas`:''}`}); }
      else streak = 0;
    }
  }
  // missões diárias (desde que o Sistema foi ativado)
  const hoje = dayStart(now); let mDone = 0, mTot = 0;
  for (let t = dayStart(S.sys.inicio || now); t <= hoje; t = addDays(t, 1)){
    const k = dayKey(t), ms = missoesDia(k), n = ms.filter(m => m.ok).length;
    if (t > hoje - 28*DIA_MS){ mDone += n; mTot += ms.length; }
    if (n) ledger.push({ts:t + 12*3600e3, xp:n*2 + (n === ms.length ? 5 : 0), tipo:'missao', txt:`Missões diárias ${n}/${ms.length}`, todas:n === ms.length});
  }
  for (const p of (S.sys.provasHist||[])) ledger.push(p.ok ? {ts:p.ts, xp:100, tipo:'prova', txt:`Prova de promoção concluída: Rank ${RANKS[p.alvo]}`} : {ts:p.ts, xp:0, tipo:'pen', txt:`Prova de promoção para Rank ${RANKS[p.alvo]} falhou`});
  const totalXp = ledger.reduce((a,e) => a + e.xp, 0), lvl = levelFrom(totalXp);
  // força: melhor 1RM estimada (até 10 reps) do último ano
  const ano = now - 365*DIA_MS, mes = now - 28*DIA_MS, best = {agach:0, supino:0, terra:0, remada:0}; let pull = 0;
  for (const s of sess){ if (s.ts < ano) continue;
    for (const it of (s.itens||[])){
      const L = liftOf(it.nome);
      if (L) for (const st of (it.sets||[])) if (+st.kg > 0 && +st.reps > 0 && +st.reps <= 10) best[L] = Math.max(best[L], e1rm(st.kg, st.reps));
      if (/barra-fixa|pull-up|chin-up/.test(norm(it.nome))) for (const st of (it.sets||[])) pull = Math.max(pull, +st.reps||0);
    } }
  const T = STD[sexo];
  const liftScore = L => { if (!peso || !best[L]) return 0; const r = best[L]/peso, t = T[L]; if (r < t[0]) return r/t[0];
    for (let i = 0; i < 4; i++) if (r < t[i+1]) return (i+1) + (r - t[i])/(t[i+1]-t[i]);
    return 5 + Math.min(1, (r - t[4])/(t[4]*0.15)); };
  const lifts = LIFTS.map(([L, nome]) => { const sc = liftScore(L), idx = Math.min(5, Math.floor(sc));
    return {L, nome, kg:best[L], ratio: peso ? best[L]/peso : 0, sc, rank:RANKS[idx], prox: idx < 5 && peso ? Math.ceil(T[L][idx]*peso*2)/2 : null}; });
  const mean = lifts.reduce((a,l) => a + l.sc, 0) / lifts.length;
  const recent = sess.filter(s => s.ts >= mes);
  const setsW = recent.reduce((a,s) => a + sessSets(s), 0) / 4;
  const cardW = recent.filter(s => (s.itens||[]).some(it => isCardio(it.nome))).length / 4;
  const hiitW = recent.filter(s => (s.itens||[]).some(it => HIIT_RX.test(norm(it.nome)))).length / 4;
  const cur = weekStart(now); let wTot = 0, wOk = 0;
  for (let i = 1; i <= 8; i++){ const ws = addDays(cur, -7*i); if (!sess.length || ws < weekStart(sess[0].ts)) break;
    wTot++; const we = addDays(ws, 7); if (sess.filter(s => s.ts >= ws && s.ts < we).length >= meta) wOk++; }
  const miss56 = misses.filter(m => m.ts >= now - 56*DIA_MS).length;
  const cap = v => Math.round(Math.max(0, Math.min(100, v)));
  const attr = {
    forca: cap(mean/6*100),
    resistencia: cap(setsW*0.6 + cardW*10),
    agilidade: cap(cardW*15 + Math.min(40, pull*2) + hiitW*10),
    disciplina: cap((wTot ? wOk/wTot : 0)*50 + (mTot ? mDone/mTot : 0)*30 + (wTot ? Math.max(0, 20 - 5*miss56) : 0))
  };

  let gIdx = 1; for (let i = 2; i < 6; i++){ if (semanas >= RANK_GATE[i][0] && attr.disciplina >= RANK_GATE[i][1]) gIdx = i; else break; }
  // elegível = força + tempo + disciplina; confirmado = ranks conquistados em prova de promoção
  const elegivel = Math.min(fIdx, gIdx), conf = S.sys.rankConf == null ? elegivel : S.sys.rankConf;
  const rIdx = Math.min(elegivel, conf);
  ledger.sort((a,b) => b.ts - a.ts);
  return {...lvl, totalXp, rank:RANKS[rIdx], rIdx, fIdx, gIdx, elegivel, conf, semanas, lifts, attr, peso, sexo, penal, faltas, ledger, longPRs, streak:sysOfensiva(sess)};
}
/* Conquistas: só marcos reais. Na primeira vez apenas registra o estado. */

  if (JSON.stringify(now) !== JSON.stringify(seen)){ S.sys.seen = now; Store.persistLocal(); }

/* ---------- 1RM estimada (Epley) ---------- */
const kgNum = v => +String(v ?? '').replace(',', '.') || 0;
function rm1(kg, reps){ kg = kgNum(kg); reps = parseInt(reps) || 0; return kg > 0 && reps > 0 ? kg * (1 + reps / 30) : 0; } // 1RM = carga × (1 + reps/30)
/* maior 1RM estimada de cada exercício (só séries de até 12 reps, onde a fórmula é confiável) */
function rmTable(){
  const t = {};
  for (const s of S.sessoes) for (const it of (s.itens||[])) for (const st of (it.sets||[])){
    const r = parseInt(st.reps) || 0; if (r > 12) continue; const v = rm1(st.kg, r); if (!v) continue;
    const cur = t[it.key]; if (!cur || v > cur.rm) t[it.key] = {rm:Math.round(v*10)/10, kg:kgNum(st.kg), reps:r, ts:s.ts, nome:it.nome};
  }
  return t;
}
const COMPOSTO_RX = /agachamento|supino|terra|remada|desenvolvimento|barra-fixa|leg-press|stiff|puxada|bulgaro|hack|elevacao-pelvica|hip-thrust|mergulho|afundo|passada|flexao|levantamento/;
const isComposto = name => !!liftOf(name) || COMPOSTO_RX.test(norm(name));

/* ---------- Modo Sombra: último treino do exercício ---------- */
function lastOf(key){ const h = histFor(key).filter(x => !x.deload); return h[h.length-1] || null; }
function ghostTxt(last){
  const sets = last.sets.filter(s => kgNum(s.kg) > 0 || +s.reps > 0); if (!sets.length) return 'sem séries registradas';
  const k0 = kgNum(sets[0].kg), same = sets.every(s => kgNum(s.kg) === k0 && String(s.reps) === String(sets[0].reps));
  const desc = same ? `${sets.length}x${sets[0].reps}${k0 ? ` com ${fmt(k0)}kg` : ''}` : sets.map(s => `${kgNum(s.kg) ? fmt(kgNum(s.kg)) + '×' : ''}${s.reps}`).join(' · ');
  const rm = Math.max(0, ...sets.filter(s => +s.reps <= 12).map(s => rm1(s.kg, s.reps)));
  return desc + (rm ? ` | 1RM Est: ${fmt(rm)}kg` : '');
}
function beatsGhost(it, j, s){
  const last = lastOf(it.key); if (!last || !last.sets.length) return false;
  const ls = last.sets[j] || last.sets[last.sets.length-1];
  const kg = kgNum(s.kg), r = parseInt(s.reps) || 0, lkg = kgNum(ls.kg), lr = parseInt(ls.reps) || 0;
  if (!r) return false;
  if (!kg && !lkg) return r > lr;
  return (kg > lkg && r >= lr) || (kg >= lkg && r > lr) || (kg > 0 && rm1(kg, r) > rm1(lkg, lr) + 0.05);
}

/* ---------- Fadiga (RIR 0 repetido + estagnação) e Modo Deload ---------- */
const deloadAtivo = () => !!(S.sys.deload && Date.now() < S.sys.deload.fim);
function fadiga(){
  const cur = weekStart(Date.now()), semanas = [];
  for (let i = 0; i < 5; i++){
    const ws = addDays(cur, -7*i), we = addDays(ws, 7); let tot = 0, f0 = 0;
    for (const s of S.sessoes) if (s.ts >= ws && s.ts < we && !s.deload) for (const it of (s.itens||[])) for (const st of (it.sets||[]))
      if (st.rir !== undefined && st.rir !== ''){ tot++; if (String(st.rir) === '0') f0++; }
    semanas.push({ws, tot, f0, falha: f0 >= 3 && f0 / tot >= 0.3});
  }
  const seguidas = semanas.every(w => w.falha);
  // estagnação: melhor 1RM dos últimos 14 dias vs. os 3 semanas anteriores, nos exercícios em comum
  const now = Date.now(), best = (a, b) => { const m = {}; for (const s of S.sessoes) if (s.ts >= a && s.ts < b && !s.deload) for (const it of (s.itens||[])) for (const st of (it.sets||[])){
      const r = parseInt(st.reps)||0; if (r > 12) continue; const v = rm1(st.kg, r); if (v > (m[it.key]||0)) m[it.key] = v; } return m; };
  const rec = best(now - 14*DIA_MS, now + 1), ant = best(now - 35*DIA_MS, now - 14*DIA_MS);
  const ratios = Object.keys(rec).filter(k => ant[k]).map(k => rec[k] / ant[k]);
  const med = ratios.length ? median(ratios) : null;
  const estagnou = med !== null && ratios.length >= 2 && med <= 1.005;
  const recente = (S.sys.deloads||[]).some(d => d.fim > now - 28*DIA_MS);
  const alerta = seguidas && estagnou && !deloadAtivo() && !recente;
  const txt = `${semanas.filter(w=>w.falha).length} semanas seguidas com muitas séries em RIR 0 e 1RM ${med === null ? 'sem dados' : med < 0.995 ? 'em queda' : 'estagnada'}${med ? ` (${med >= 1 ? '+' : ''}${fmt((med-1)*100, 1)}%)` : ''}.`;
  return {alerta, seguidas, estagnou, semanas, med, txt};
}
const round25 = v => Math.max(0, Math.round(v / 2.5) * 2.5);

/* ---------- Provas de promoção de rank (dungeons) ---------- */
function provaMetas(alvo){
  const peso = sysPeso(), T = STD[S.sys.sexo === 'F' ? 'F' : 'M'], since = Date.now() - 90*DIA_MS, cands = {};
  for (const s of S.sessoes) if (s.ts >= since && !s.deload) for (const it of (s.itens||[])){
    if (isCardio(it.nome)) continue; let teve = false;
    for (const st of (it.sets||[])){ const r = parseInt(st.reps)||0, v = rm1(st.kg, r); if (!v || r > 12) continue; teve = true;
      const c = cands[it.key] = cands[it.key] || {key:it.key, nome:it.nome, rm:0, reps:5, n:0, L:liftOf(it.nome)};
      if (v > c.rm){ c.rm = v; c.reps = Math.min(8, Math.max(3, r)); } }
    if (teve) cands[it.key].n++;
  }
  const lista = Object.values(cands).sort((a,b) => (!!b.L - !!a.L) || (b.n - a.n)).slice(0, 3);
  if (lista.length < 2) return null;
  return lista.map(c => {
    let alvoRm = c.rm * 1.025;                                                     // superar a melhor marca em 2,5%
    if (c.L && peso) alvoRm = Math.min(Math.max(alvoRm, T[c.L][alvo-1] * peso), c.rm * 1.08); // e buscar o padrão do rank, sem passar de +8%
    return {key:c.key, nome:c.nome, reps:c.reps, kg:Math.max(2.5, Math.ceil(alvoRm / (1 + c.reps/30) / 2.5) * 2.5)};
  });
}
function provaProgresso(p){
  return p.metas.map(m => { let feito = null;
    for (const s of S.sessoes) if (s.ts >= p.inicio && s.ts <= p.fim) for (const it of (s.itens||[])) if (it.key === m.key)
      for (const st of (it.sets||[])) if (kgNum(st.kg) >= m.kg && (parseInt(st.reps)||0) >= m.reps){ feito = s.ts; }
    return {...m, feito}; });
}
function provaInfo(c){
  const p = S.sys.prova, now = Date.now();
  if (p) return {estado:'ativa', alvo:p.alvo, p, prog:provaProgresso(p), dias:Math.max(0, Math.ceil((p.fim - now) / DIA_MS))};
  if (c.elegivel > c.conf){
    const alvo = c.conf + 1;
    if (now < (S.sys.cooldown||0)) return {estado:'cooldown', alvo, dias:Math.ceil((S.sys.cooldown - now) / DIA_MS)};
    const metas = provaMetas(alvo);
    return metas ? {estado:'disponivel', alvo, metas} : {estado:'semdados', alvo};
  }
  return {estado:'nenhuma'};
}
function provaAtualiza(){
  const p = S.sys.prova; if (!p) return null;
  const prog = provaProgresso(p), now = Date.now();
  if (prog.every(m => m.feito)){
    S.sys.rankConf = Math.max(S.sys.rankConf ?? 0, p.alvo); S.sys.provasHist = [...(S.sys.provasHist||[]), {alvo:p.alvo, ok:true, ts:Math.max(...prog.map(m => m.feito))}]; S.sys.prova = null;
    return {t:'DUNGEON CONCLUÍDA', big:`Rank ${RANKS[p.alvo]} confirmado`, sub:`Você cumpriu todas as metas da prova. +100 XP. ${RANK_NOME[p.alvo]}.`};
  }
  if (now > p.fim){
    S.sys.provasHist = [...(S.sys.provasHist||[]), {alvo:p.alvo, ok:false, ts:p.fim}]; S.sys.prova = null; S.sys.cooldown = p.fim + 7*DIA_MS;
    return {warn:true, t:'DUNGEON FALHOU', big:'Prova não concluída', sub:`O prazo de 7 dias acabou com ${prog.filter(m => m.feito).length} de ${prog.length} metas. Nova tentativa liberada em 7 dias.`};
  }

/* ---------- Mapa de recuperação muscular ---------- */
const REC_GRUPOS = [['Peito',['peitoral']],['Costas',['dorsais','costas_meio','trapezio','lombar']],['Quadríceps',['quadriceps']],['Posterior',['posteriores','gluteos']],
  ['Ombros',['ombros']],['Bíceps',['biceps']],['Tríceps',['triceps']],['Abdômen',['abdomen','obliquos']]];
function recuperacao(){
  const now = Date.now(), recent = S.sessoes.filter(s => s.ts >= now - 4*DIA_MS);
  return REC_GRUPOS.map(([nome, ms]) => {
    let fim = 0, horas = 0, carga = 0;
    for (const s of recent){
      let ef = 0;
      for (const it of (s.itens||[])){ const inf = getInfo(it.nome); if (!inf) continue;
        const w = inf.primarios.some(m => ms.includes(m)) ? 1 : inf.secundarios.some(m => ms.includes(m)) ? 0.5 : 0; if (!w) continue;
        for (const st of (it.sets||[])) ef += w * (String(st.rir) === '0' ? 1.25 : 1); }
      const h = ef >= 8 ? 72 : ef >= 4 ? 48 : ef >= 2 ? 24 : 0;          // volume alto = 72 h, moderado = 48 h
      const end = s.ts + (s.duracao||0)*1000 + h*3600e3;
      if (h && end > fim){ fim = end; horas = h; carga = ef; }
    }
    const left = Math.max(0, fim - now);
    return {nome, left, horas, carga, pronto: left <= 0, frac: horas ? left / (horas*3600e3) : 0};
  });
}
function recMap(){
  return `<div class="recmap">${recuperacao().map(g => `<div class="rec ${g.pronto ? 'ok' : g.frac > 0.5 ? 'hot' : 'warm'}">
    <b>${esc(g.nome)}</b><small>${g.pronto ? 'Pronto para Combate' : `Em recuperação · ${Math.ceil(g.left/3600e3)} h`}</small>
    <i style="width:${g.pronto ? 100 : Math.round((1-g.frac)*100)}%"></i></div>`).join('')}</div>`;
}

function weekCounts(nWeeks){
  const now = weekStart(Date.now()), arr = [];
  for (let i = nWeeks-1; i >= 0; i--){ const ws = now - i*7*864e5; const we = ws + 7*864e5; arr.push({ws, n:S.sessoes.filter(s=>s.ts>=ws && s.ts<we).length}); }

}

function sugestaoHoje(){
  if (!S.fichas.length) return null;
  const div = S.perfil.divisao || {}; const temDiv = Object.values(div).some(v => v);
  const dow = new Date().getDay();
  const rot = () => {
    const last = [...S.sessoes].reverse().find(s => S.fichas.some(f=>f.id===s.fichaId));
    if (!last) return S.fichas[0];

function sugestaoCarga(item){

/* =========================================================
   GRÁFICOS (SVG)
   ========================================================= */
function niceStep(x){ if (!(x > 0)) return 1; const p = 10 ** Math.floor(Math.log10(x)); const f = x/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function lineChart(pts, unit){
  const W=340, H=200, L=40, R=18, T=22, B=28;
  const ys = pts.map(p=>p.y); let lo = Math.min(...ys), hi = Math.max(...ys);
  if (lo === hi){ lo = lo*0.85; hi = hi*1.15 || 1; }
  const pad = (hi-lo)*0.15; lo = Math.max(0, lo-pad); hi = hi+pad;
  const step = niceStep((hi-lo)/4); lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  const X = i => pts.length === 1 ? L + (W-L-R)/2 : L + i*(W-L-R)/(pts.length-1);
  const Y = v => T + (H-T-B) * (1 - (v-lo)/(hi-lo));
  const gid = 'g' + uid();
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v,1)}</text>`;
  const k = Math.max(1, Math.ceil(pts.length/6));
  pts.forEach((p,i) => { if (i % k === 0 || i === pts.length-1) { if (i !== pts.length-1 && pts.length-1-i < k) return; g += `<text class="ax" x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(p.label)}</text>`; } });
  const d = pts.map((p,i) => (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = pts.length > 1 ? `<path d="${d} L${X(pts.length-1).toFixed(1)} ${Y(lo)} L${X(0).toFixed(1)} ${Y(lo)} Z" fill="url(#${gid})"/>` : '';
  const dots = pts.map((p,i) => `<circle class="pt${i===pts.length-1?' end':''}" cx="${X(i)}" cy="${Y(p.y)}" r="${i===pts.length-1?6:3.5}" data-act="tip" data-tip="${esc(p.label)}: ${fmt(p.y)} ${unit}"><title>${esc(p.label)}: ${fmt(p.y)} ${unit}</title></circle>`).join('');
  const lx = X(pts.length-1), ly = Y(pts[pts.length-1].y);
  const lab = `<text class="vl" x="${lx > W-60 ? lx-10 : lx}" y="${ly-12}" text-anchor="${lx > W-60 ? 'end' : 'middle'}">${fmt(pts[pts.length-1].y)} ${unit}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução semanal">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop class="ar-s" offset="0" stop-opacity=".35"/><stop class="ar-s" offset="1" stop-opacity="0"/></linearGradient></defs>
    ${g}${area}${pts.length>1?`<path class="ln" d="${d}"/>`:''}${dots}${lab}</svg>`;
}
function barChart(wc, meta){
  const W=340, H=160, L=26, R=10, T=16, B=26;
  const hi = Math.max(meta+1, ...wc.map(w=>w.n), 4);
  const bw = (W-L-R)/wc.length; const Y = v => T + (H-T-B)*(1-v/hi);
  let g = '';
  for (let v = 0; v <= hi; v += Math.ceil(hi/4)) g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`;
  wc.forEach((w,i) => {

    g += `<rect class="bar${w.n>=meta?'':' dim'}" x="${x.toFixed(1)}" y="${Y(w.n).toFixed(1)}" width="${(bw*0.6).toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="3"><title>Semana de ${ddmm(w.ws)}: ${w.n} treinos</title></rect>`;

const num = v => v === null || v === undefined || v === '' || isNaN(+v) ? null : +v;
function medDue(){
  const last = S.medidas[S.medidas.length-1]; if (!last) return null;
  const dias = (FREQ[S.perfil.freqMed] || FREQ.mensal)[1];
  const a = new Date(); a.setHours(0,0,0,0); const b = new Date(last.ts); b.setHours(0,0,0,0);
  return dias - Math.round((a-b)/864e5);
}
function diffTxt(a, b, unit){ const d = Math.round((b-a)*10)/10; return d === 0 ? 'igual' : `${d>0?'+':''}${fmt(d)} ${unit}`; }
function medCard(){
  const M = S.medidas;
  if (!M.length) return `<section class="card"><h2>Peso e medidas</h2><p class="note">Anote peso e medidas e atualize ${esc(FREQ[S.perfil.freqMed||'mensal'][0].toLowerCase())}. Depois é só comparar uma data com a outra.</p>
    <button class="btn" data-act="addMed">${IC.plus}Registrar primeira medição</button></section>`;
  const last = M[M.length-1], first = M.find(r => num(r.peso) !== null);

function weekCard(){

function weeklyPlan(){
  const div = S.perfil.divisao || {};
  const days = Object.keys(div).filter(d => S.fichas.some(f=>f.id===div[d])).map(d => ({d:+d, f:S.fichas.find(f=>f.id===div[d])}));
  return days.length ? {days, assumed:false} : {days:S.fichas.map((f,i)=>({d:null, f})), assumed:true};
}
function fichaLoad(f){
  const load = {}; const unknown = [];
  for (const e of (f.exercicios||[])){
    const inf = getInfo(e.nome); const n = +e.series || 0;
    if (!inf){ unknown.push(e.nome); continue; }
    inf.primarios.forEach(m => load[m] = (load[m]||0) + n);
    inf.secundarios.forEach(m => load[m] = (load[m]||0) + n*0.5);
  }
  return {load, unknown};
}
function vAnalise(){
  if (!S.fichas.length) return `<section class="card"><p class="note">Cadastre suas fichas para ver a análise de volume.</p></section>`;
  const nivel = S.perfil.nivel || 'intermediaria'; const [nl, lo, hi] = NIVEIS[nivel];
  const plan = weeklyPlan(); const tot = {}; const unknown = new Set(); const perDay = {};
  for (const {d, f} of plan.days){ const {load, unknown:u} = fichaLoad(f); u.forEach(x=>unknown.add(x)); for (const m in load) tot[m] = (tot[m]||0) + load[m]; if (d !== null) perDay[d] = {f, load}; }
  const maxV = Math.max(hi+4, ...Object.values(tot));
  const alerts = [];
  if (!plan.assumed){
    for (let d = 0; d < 7; d++){ const a = perDay[d], b = perDay[(d+1)%7]; if (!a || !b) continue;
      const over = Object.keys(a.load).filter(m => MUSC_MAIN.includes(m) && !['abdomen','panturrilhas'].includes(m) && a.load[m] >= 4 && (b.load[m]||0) >= 4);
      if (over.length) alerts.push(`${over.map(m=>MUSC[m].split(' (')[0]).join(', ')} pesado em dias seguidos (${DIAS[d]} e ${DIAS[(d+1)%7]}). Dê 48 h de recuperação ou reduza o volume de um dos dias.`);
    }
  }
  S.fichas.forEach(f => { const m = fichaMin(f); if (m > 80) alerts.push(`${f.nome} leva ~${m} min. Acima de 75-80 min a qualidade das últimas séries costuma cair.`); });
  const low = MUSC_MAIN.filter(m => (tot[m]||0) < lo && !['abdomen','panturrilhas','biceps','triceps'].includes(m));
  return `<section class="card"><div class="between"><h2>Séries por semana</h2><span class="chip acc">${esc(nl)}: ${lo}-${hi}</span></div>
    <p class="note">Séries semanais por músculo somando todas as fichas${plan.assumed?' (sem divisão definida: contei cada ficha 1x por semana)':' conforme sua divisão'}. Músculo secundário conta meia série. A faixa verde é o volume recomendado para o seu nível.</p>
    <div class="field"><label for="nivel">Seu nível</label><select class="input" id="nivel" data-in="nivel">${Object.entries(NIVEIS).map(([k,v])=>`<option value="${k}"${k===nivel?' selected':''}>${v[0]} (${v[1]}-${v[2]} séries)</option>`).join('')}</select></div>
    <div class="vol">${MUSC_ORDER.filter(m => tot[m] || MUSC_MAIN.includes(m)).map(m => {
      const v = tot[m]||0; const main = MUSC_MAIN.includes(m);
      const st = !main ? '' : v < lo ? '<span class="chip warn">abaixo</span>' : v > hi ? '<span class="chip bad">acima</span>' : '<span class="chip ok">na faixa</span>';
      return `<div class="vrow"><div class="between"><span>${esc(MUSC[m])}</span><span class="row" style="gap:6px"><b class="mono">${fmt(v)}</b>${st}</span></div>
        <div class="vbar">${main?`<div class="band" style="left:${lo/maxV*100}%;width:${(hi-lo)/maxV*100}%"></div>`:''}<div class="fill" style="width:${Math.min(v/maxV*100,100)}%"></div></div></div>`;
    }).join('')}</div></section>
  <section class="card"><h2>Coerência da divisão</h2>
    ${alerts.length ? alerts.map(a=>`<div class="alert">${IC.warn}<span>${esc(a)}</span></div>`).join('') : `<div class="alert ok">${IC.ok}<span>Nenhum conflito de recuperação encontrado${plan.assumed?'. Defina a divisão semanal para uma análise dia a dia':''}.</span></div>`}
    ${low.length ? `<div class="alert">${IC.warn}<span>Volume baixo para ${esc(low.map(m=>MUSC[m].split(' (')[0]).join(', '))}. Se for prioridade, some 2-4 séries por semana.</span></div>` : ''}
    ${unknown.size ? `<div class="alert">${IC.info}<span>Sem dados de músculos para: ${esc([...unknown].join(', '))}. Abra o exercício e ${Store.ai?'toque em "Buscar com IA" ou ':''}marque os músculos para incluir na análise.</span></div>` : ''}
  </section>`;
}

function progresso(){ let done=0, total=0; ATIVO.itens.forEach(it => it.sets.forEach(s => { total++; if (s.done) done++; })); return {done, total}; }
function exCard(it, i){
  const last = lastOf(it.key), rmRec = (S.sys.rm||{})[it.key];
  const sug = ATIVO && ATIVO.deload ? {tipo:'keep', txt:'Semana de deload: cargas reduzidas em 35%. Foque na técnica e pare longe da falha (RIR 3+).'} : sugestaoCarga(it); const pr = maxKgBefore(it.key);
  const complete = it.sets.length && it.sets.every(s=>s.done);
  return `<div class="ex-card${complete?' complete':''}" id="exc-${i}">
    <div class="ex-h"><span class="exn">${String(i+1).padStart(2,'0')}</span>

      <button class="icon-btn" data-act="info" data-name="${esc(it.nome)}" aria-label="Como executar">${IC.info}</button></div>
    ${it.obs?`<p class="note">${esc(it.obs)}</p>`:''}
    ${last ? `<p class="lastline ghost"><span class="gh">SOMBRA</span>Último treino (${rel(last.ts)}): ${esc(ghostTxt(last))}${rmRec ? ` · recorde 1RM ${fmt(rmRec.rm)}kg` : ''}</p>` : `<p class="lastline">Primeira vez registrando este exercício.</p>`}
    ${sug ? `<div class="sug">${sug.tipo==='up'?IC.up2:IC.spark}<span>${esc(sug.txt)}</span></div>` : ''}
    <div class="sets"><div class="set-h"><span>Série</span><span>kg</span><span>Reps</span><span>RIR</span><span></span></div>
    ${it.sets.map((s,j)=>setRow(it,i,s,j,pr)).join('')}</div>
    <div class="ex-f"><button class="btn sm" data-act="addSet" data-i="${i}">${IC.plus}Série</button><button class="btn sm ghost" data-act="rmSet" data-i="${i}"${it.sets.length<=1?' disabled':''}>${IC.minus}Série</button></div></div>`;
}
function setRow(it, i, s, j, pr){
  const ph = (parseRange(it.reps)||[])[1] || '';
  const isPR = s.done && pr > 0 && (+s.kg||0) > pr;
  const rir = s.rir ?? '';
  return `<div class="set-r${s.done?' done':''}${beatsGhost(it, j, s)?' beat':''}" id="set-${i}-${j}"><span class="sn">${j+1}${isPR?'<span class="prtag">PR</span>':''}</span>
    <input id="kg-${i}-${j}" inputmode="decimal" aria-label="Carga em kg da série ${j+1}" data-in="kg" data-i="${i}" data-s="${j}" value="${esc(s.kg)}" placeholder="kg">
    <input id="rp-${i}-${j}" inputmode="numeric" aria-label="Repetições da série ${j+1}" data-in="reps" data-i="${i}" data-s="${j}" value="${esc(s.reps)}" placeholder="${esc(ph)}">
    <button class="rirb${rir==='0'?' r0':rir!==''?' on':''}" data-act="rir" data-i="${i}" data-s="${j}" aria-label="RIR da série ${j+1}: ${rir===''?'não informado':rir}. Toque para mudar">${rir===''?'–':esc(rir)}</button>
    <button class="chk" data-act="done" data-i="${i}" data-s="${j}" aria-label="Marcar série ${j+1} como feita">${IC.check}</button></div>`;
}
function startWorkout(fid){
  const f = S.fichas.find(x=>x.id===fid); if (!f) return;
  if (ATIVO && ATIVO.fichaId !== fid){ toast('Finalize ou descarte o treino em andamento primeiro.'); go('treino'); return; }
  if (!ATIVO){
    const dl = deloadAtivo();
    ATIVO = { id:uid(), fichaId:f.id, fichaNome:f.nome, inicio:Date.now(), deload:dl, itens:(f.exercicios||[]).map(e => {
      const key = histKey(e.nome); const last = lastOf(key);
      const n = Math.max(1, +e.series || 3);
      const kgDe = j => { const v = last ? (last.sets[j]||last.sets[last.sets.length-1]||{}).kg ?? '' : ''; return dl && kgNum(v) ? String(round25(kgNum(v) * 0.65)) : v; };
      return { exId:e.id, nome:e.nome, key, series:n, reps:e.reps, descanso:+e.descanso||60, rir:e.rir, tecnica:e.tecnica, obs:e.obs,
        sets:Array.from({length:n}, (_,j) => ({kg:kgDe(j), reps:'', rir:'', done:false})) };
    })};
    saveAtivo();
  }
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(()=>{}); } catch(e){}
  go('treino');
}
function updProgress(){
  const {done,total} = progresso();
